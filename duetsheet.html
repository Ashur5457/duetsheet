<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Duetsheet</title>
<link id="fontlink" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700&family=Noto+Serif:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.6/Sortable.min.js"></script>
<style>
:root{
  --bg:#E9EEF1;--paper:#FFFFFF;--ink:#13232C;--muted:#5A6B75;--line:#D2DBE0;--soft:#F3F6F8;
  --accent:#1F6F8B;--accent-ink:#FFFFFF;
  --mark:#D6336C;--mark-fill:rgba(214,51,108,.12);
  --hl:#FFCF33;--hl-fill:rgba(255,207,51,.30);--hl-stroke:#B98A00;
  --ok:#2E7D4F;--ok-fill:rgba(46,125,79,.10);
  --c0:#7D8D99;--c1:#1F6F8B;--c2:#D9781A;--c3:#6B4FA0;--c4:#2E7D4F;--c5:#B83B5E;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C171D;--paper:#15242C;--ink:#E4EDF1;--muted:#93A6B1;--line:#2A3E49;--soft:#1B2C35;
  --accent:#5DB7D4;--accent-ink:#0C171D;
  --mark:#FF6B9A;--mark-fill:rgba(255,107,154,.16);
  --hl:#FFD84D;--hl-fill:rgba(255,216,77,.24);--hl-stroke:#FFD84D;
  --ok:#6CC38A;--ok-fill:rgba(108,195,138,.14);
  --c0:#A3B3BF;--c1:#5DB7D4;--c2:#F2A340;--c3:#A98BE0;--c4:#6CC38A;--c5:#F07A9C;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C171D;--paper:#15242C;--ink:#E4EDF1;--muted:#93A6B1;--line:#2A3E49;--soft:#1B2C35;
  --accent:#5DB7D4;--accent-ink:#0C171D;
  --mark:#FF6B9A;--mark-fill:rgba(255,107,154,.16);
  --hl:#FFD84D;--hl-fill:rgba(255,216,77,.24);--hl-stroke:#FFD84D;
  --ok:#6CC38A;--ok-fill:rgba(108,195,138,.14);
  --c0:#A3B3BF;--c1:#5DB7D4;--c2:#F2A340;--c3:#A98BE0;--c4:#6CC38A;--c5:#F07A9C;
  color-scheme:dark}
/* font stacks per interface language; Latin glyphs come first, CJK fonts fill in the rest */
:root{--sans:'Noto Sans',system-ui,-apple-system,'Segoe UI',sans-serif;--serif:'Noto Serif',Georgia,'Times New Roman',serif}
:root:lang(zh-Hant){--sans:'Noto Sans','Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;--serif:'Noto Serif','Noto Serif TC','Songti TC','PMingLiU',serif}
:root:lang(zh-Hans){--sans:'Noto Sans','Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif;--serif:'Noto Serif','Noto Serif SC','Songti SC','SimSun',serif}
:root:lang(ja){--sans:'Noto Sans','Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',system-ui,sans-serif;--serif:'Noto Serif','Noto Serif JP','Hiragino Mincho ProN','Yu Mincho',serif}
:root:lang(ko){--sans:'Noto Sans','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;--serif:'Noto Serif','Noto Serif KR','AppleMyungjo','Batang',serif}
html,body{height:100%}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 var(--sans)}
h1,h2,.btitle{font-family:var(--serif);font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.top .in{max-width:1500px;margin:0 auto;padding:10px 22px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.top h1{font-size:18px;margin:0 8px 0 0;white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:transparent;padding:6px 14px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.hint{color:var(--muted);font-size:13px;flex:1 1 220px}
#agentbar{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin:0 0 12px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);font-size:13px}
#agentbar[hidden]{display:none}
.reply.me{border-left-color:var(--c2)}
.linkbtn.rv{font-size:12px;color:var(--muted)}
.flist li.grp{background:var(--soft);font-weight:500;padding:5px 6px}
.flist li.sub{padding-left:14px}
.ftop{margin:0 0 6px}
.wstats{margin:6px 0;font-size:13px;border-collapse:collapse}.wstats th{text-align:left;font-weight:400;color:var(--muted);padding:2px 14px 2px 0}
.wadd input{flex:1;min-width:0;font:inherit;font-size:13px;padding:4px 6px;border:1px solid var(--line);border-radius:5px;background:var(--paper);color:var(--ink)}
.wrules .chk{display:flex;gap:6px;align-items:baseline;flex:1 1 60%}
.areply{display:flex;gap:6px;align-items:flex-end;margin:6px 0}
.areply textarea{flex:1;min-width:0;box-sizing:border-box;font:inherit;font-size:13px;padding:4px 6px;border:1px solid var(--line);border-radius:5px;background:var(--paper);color:var(--ink)}
#agentbar .conn{display:inline-flex;gap:6px;align-items:center;font-weight:500}
#agentbar .sp{flex:1}
#agentbar .ast{font-size:13px;color:var(--muted)}
#agentbar .ast.bad{color:var(--c5)}
#agentbar .ast.ok{color:var(--ok)}
#lang{border:1px solid var(--line);border-radius:7px;padding:5px 8px;background:var(--paper)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.langbox{max-width:560px;font-size:14px}
.langbox ol{padding-left:1.3em;margin:6px 0 12px}
.langbox ol li{margin:0 0 6px}
.langbox ul{list-style:none;padding:0;margin:6px 0}
.langbox li.cl{display:flex;gap:10px;align-items:baseline;padding:4px 0;border-bottom:1px solid var(--line)}
.langbox h4{margin:14px 0 4px;font-size:13px;font-weight:500;color:var(--muted)}
.langbox li.cl .linkbtn{margin-left:auto}
.btn.issues{border-color:var(--mark);color:var(--mark);font-weight:500}
.btn.issues.warn{border-color:var(--c2);color:var(--c2)}
.issuebox{max-width:760px}
.issuelist{list-style:none;padding:0;margin:6px 0 10px;max-height:60vh;overflow:auto}
.issuelist li{border-bottom:1px solid var(--line);padding:6px 0;font-size:13px}
.issuelist .lvl{font-size:11.5px;border-radius:4px;padding:0 6px;color:#fff;background:var(--mark)}
.issuelist li.warning .lvl{background:var(--c2)}
.issuelist pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.45 ui-monospace,Menlo,Consolas,monospace;background:var(--soft);padding:6px 8px;border-radius:5px;margin:4px 0 0}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:7px;padding:5px 12px;cursor:pointer}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.small{padding:2px 9px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}

/* layout */
.wrap{max-width:1500px;margin:0 auto;padding:22px;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:26px;align-items:start}
body.nopanel .wrap{grid-template-columns:minmax(0,1fr)}
body.nopanel #panel{display:none}
main{min-width:0}
#note-db{background:var(--hl-fill);border:1px solid var(--hl-stroke);border-radius:8px;padding:8px 12px;margin:0 0 14px;font-size:13.5px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
#note-db.saved{background:var(--ok-fill);border-color:var(--ok)}
#note-text{flex:1 1 320px}
#note-acts{display:flex;flex-wrap:wrap;gap:6px}
.flist{list-style:none;margin:6px 0 8px;padding:0}
.flist li{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--line);font-size:13px}
.flist .fname{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;overflow-wrap:anywhere}
.flist .fstat{color:var(--muted);font-size:12px;flex:1 1 120px}
.flist .fstat.stale{color:var(--c2);font-weight:500}
.flist .btn{margin-left:auto}
/* data chain */
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c0);flex:0 0 auto}
.dot.ok{background:var(--ok)}.dot.stale{background:var(--c5)}
.srcl{display:flex;align-items:center;gap:7px;margin:5px 0 0;padding:0;border:0;background:none;color:var(--ink);font:inherit;font-size:13.5px;font-weight:600;line-height:1.45;cursor:pointer;text-align:left;max-width:100%}
.srcl .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.srcl:hover .t{text-decoration:underline}
.chain{font-size:13px;width:min(760px,86vw);line-height:1.45}
.chain .fr{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:center;padding:2px 0}
.chain .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;overflow-wrap:anywhere}
.chain .meta{color:var(--muted);font-size:12px}
.chain .why{color:var(--c5);margin:2px 0;padding-left:16px}
.chain details{margin:3px 0 3px 12px;padding-left:8px;border-left:2px solid var(--line)}
.chain summary{cursor:pointer;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.chain .kv{display:grid;grid-template-columns:auto 1fr;gap:1px 10px;margin:4px 0}
.chain .kv>span:nth-child(odd){color:var(--muted);font-size:12px}
.chain h5,.stsec h5{margin:10px 0 3px;font-size:12.5px;font-weight:500;color:var(--muted)}
.chain ul,.chlinks{list-style:none;margin:2px 0;padding:0}
.chain .st{font-weight:500}
.chsum{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;margin:4px 0}
.chain .bad{color:var(--c5);font-size:12px;font-weight:500}
.chlinks li{display:flex;gap:6px;align-items:center;padding:2px 0 2px 14px}
.flist details{width:100%}.flist summary{cursor:pointer;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.flist .dot{align-self:center}

/* page (view) */
.page{width:var(--pw);height:var(--ph);margin:0 auto;background:var(--paper);border-radius:6px;
  box-shadow:0 1px 2px rgba(0,0,0,.08),0 6px 24px rgba(0,0,0,.08);position:relative;overflow:hidden}
.page .inner{position:absolute;inset:0;padding:var(--py) var(--px);overflow:hidden;display:flex;flex-direction:column;gap:var(--gap)}
.page.scrolls .inner{overflow:auto}
.page .pno{position:absolute;right:14px;bottom:8px;font-size:12px;color:var(--muted)}
.pager{display:flex;align-items:center;justify-content:center;gap:12px;margin:16px 0 10px}
.pager .cnt{min-width:96px;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
.thumbs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.thumbs button{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:3px 10px;font-size:13px;cursor:pointer;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thumbs button[aria-current="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}

/* block content (shared) */
.blk{position:relative;flex:0 0 auto}
.duo{display:flex;gap:calc(var(--gap) * 2);align-items:flex-start;flex:0 0 auto}
.duo>.col{display:flex;flex-direction:column;gap:var(--gap);min-width:0}
.duo>.col.main{flex:3 1 0}.duo>.col.side{flex:2 1 0}
.toc{list-style:none;margin:0;padding:0}
.toc li{display:flex;align-items:baseline;gap:8px;padding:2px 0}
.toc li.l1{font-weight:500}
.toc li.l2{padding-left:1.5em;font-size:.93em}
.toc .tocl{border:0;background:none;padding:0;font:inherit;color:var(--accent);cursor:pointer;text-align:left}
.toc .tocl:hover{text-decoration:underline}
.toc .lead{flex:1 1 20px;border-bottom:1px dotted var(--line)}
.toc .pg{color:var(--muted);font-variant-numeric:tabular-nums}
.btitle{font-size:18px;margin:0 0 6px;line-height:1.35}
.md p{margin:0 0 .55em}.md p:last-child{margin-bottom:0}
.md ul{margin:0 0 .55em;padding-left:1.3em}
.cap{color:var(--muted);font-size:13px;margin:6px 0 0}
svg.chart{display:block;width:100%;height:auto;max-height:var(--chartmax);user-select:none;-webkit-user-select:none;touch-action:none}
.gl{stroke:var(--line);stroke-width:1}
.tk{fill:var(--muted)}
svg.tl .tk{font-size:11px}
.axl{fill:var(--ink)}
.pt{stroke:var(--ink);stroke-width:.7}
.axis{stroke:var(--muted);stroke-width:1;fill:none}
.ln{fill:none;stroke:var(--muted);stroke-width:1.3;stroke-linejoin:round}
.tblw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
th{font-weight:500;color:var(--muted);font-size:13px}
.imgw{position:relative;margin:0 auto;max-width:100%}
.imgw canvas{display:block;width:100%;height:auto;border-radius:4px}

.imgw svg.ov{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none}

/* annotation marks */
g.over,g.pend,g.live{pointer-events:none}
.shape{fill:var(--mark-fill);stroke:var(--mark);stroke-width:1.8;stroke-dasharray:6 4;vector-effect:non-scaling-stroke}
.ov .done .shape,.done>.shape{fill:var(--ok-fill);stroke:var(--ok)}
.ring{fill:none;stroke:var(--mark);stroke-width:2;vector-effect:non-scaling-stroke}
.done>.ring{stroke:var(--ok)}
.pendshape{fill:var(--hl-fill);stroke:var(--hl-stroke);stroke-dasharray:none;stroke-width:2.2}
.badge circle{fill:var(--mark)}.done .badge circle{fill:var(--ok)}
.badge text{fill:#fff;font-weight:700;text-anchor:middle;font-family:system-ui,sans-serif}
.pin{position:absolute;top:-9px;right:-9px;min-width:20px;height:20px;padding:0 4px;box-sizing:border-box;border-radius:10px;background:var(--mark);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;z-index:3}
.pin.done{background:var(--ok)}
.blk.annotated{outline:2px dashed var(--mark);outline-offset:4px;border-radius:2px}
.blk.sel{outline:3px solid var(--hl);outline-offset:4px}
.hit{fill:transparent}
.card.drawing{outline:3px solid var(--hl);outline-offset:2px}
.card.drawing .hit,.card.drawing .imgw svg.ov{cursor:crosshair}
body[data-draw="box"] .pt,body[data-draw="lasso"] .pt{pointer-events:none}
.flash{animation:flash .5s 3}
@keyframes flash{50%{opacity:.2}}
@media (prefers-reduced-motion:reduce){.flash{animation:none;outline:3px solid var(--hl)}}

/* edit mode */
#flow{max-width:var(--pw);margin:0 auto}
.cw{position:relative}
.bar{display:flex;align-items:center;gap:10px;margin:6px 0;cursor:pointer;user-select:none;border:0;background:none;width:100%;padding:4px 0;color:var(--muted);font-size:12.5px}
.bar .rule{flex:1;border-top:1px dotted var(--line)}
.bar.auto-break .rule{border-top:2px dashed var(--accent)}
.bar.forced .rule{border-top:3px solid var(--ink)}
.bar.avoid .rule{border-top:1px dotted var(--line)}
.bar .lbl{white-space:nowrap;padding:1px 8px;border-radius:999px;border:1px solid var(--line);background:var(--paper)}
.bar.auto-break .lbl{border-color:var(--accent);color:var(--accent)}
.bar.forced .lbl{border-color:var(--ink);color:var(--ink);font-weight:500}
.bar.avoid .lbl{color:var(--c2);border-color:var(--c2)}
.bar.beside .rule{border-top:1px dotted var(--line)}
.bar.beside .lbl{color:var(--c3);border-color:var(--c3)}
.bar:hover .lbl{background:var(--soft)}
.pstart{font-size:12px;color:var(--muted);margin:10px 0 4px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 16px 14px}
.card.over-page{border-color:var(--c2)}
.chead{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:12.5px;color:var(--muted)}
.hdl{cursor:grab;border:1px solid var(--line);background:var(--soft);border-radius:5px;padding:0 7px;font-size:15px;line-height:22px}
.hdl:active{cursor:grabbing}
.chead .sp{flex:1}
.chead .warn{color:var(--c2)}
.ghost{opacity:.35}
.ed-title{width:100%;box-sizing:border-box;border:1px solid transparent;border-radius:5px;padding:3px 6px;margin:0 0 6px;background:transparent;font-family:var(--serif);font-weight:700;font-size:18px}
.ed-title:hover,.ed-title:focus{border-color:var(--line);background:var(--soft)}
textarea.ed-text{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--soft);resize:vertical;min-height:70px;line-height:1.6}
.ed-cap{width:100%;box-sizing:border-box;border:1px solid transparent;border-radius:5px;padding:3px 6px;background:transparent;color:var(--muted);font-size:13px;margin-top:4px}
.ed-cap:hover,.ed-cap:focus{border-color:var(--line);background:var(--soft)}
details.set{margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}
details.set summary{cursor:pointer;font-size:13px;color:var(--accent)}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px 14px;margin-top:8px;font-size:13px}
.form label{display:flex;flex-direction:column;gap:3px;color:var(--muted)}
.form label.chk{flex-direction:row;align-items:center;gap:6px}
.form input[type=text],.form input[type=number],.form select{border:1px solid var(--line);border-radius:5px;padding:4px 6px;background:var(--paper);color:var(--ink)}
.addrow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:18px 0 6px}

/* panel */
#panel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);max-height:calc(100vh - 90px);overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
#panel h2{font-size:16px;margin:0}
.phead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
#count{color:var(--muted);font-size:13px}
.filters{display:flex;gap:6px;margin-bottom:10px}
.filters button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:2px 11px;font-size:13px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tabs{display:flex;border-bottom:1px solid var(--line);margin:-4px 0 12px}
.tabs{flex-wrap:wrap}
.tabs button{border:0;background:none;padding:6px 9px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;flex:0 0 auto;font-size:14.5px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:500}
.cbox{margin-top:12px;padding:10px 12px;background:var(--soft);border-radius:8px;border:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:1px 10px;font-size:12.5px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cin{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:6px;padding:6px 9px;background:var(--paper);resize:vertical;min-height:40px}
.crow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.crow .sp{flex:1}
.btn[aria-pressed="true"]{background:var(--hl-fill);border-color:var(--hl-stroke)}
.ctarget{margin:0 0 8px;font-size:12.5px;color:var(--ink);background:var(--hl-fill);border-radius:5px;padding:3px 8px;display:flex;gap:10px;align-items:baseline}
.chint{margin:6px 0 0;font-size:12px;color:var(--muted)}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}
.tag{font-size:12px;border-radius:4px;padding:0 6px;background:var(--soft);border:1px solid var(--line)}
.chip2{margin-left:auto;font-size:12px;border:1px solid var(--mark);color:var(--mark);border-radius:999px;padding:0 9px}
.is-done .chip2{border-color:var(--ok);color:var(--ok)}
.sum{margin:0 0 8px;font-weight:500}
#finishRound{margin-bottom:6px}
.chlist{list-style:none;margin:0 0 12px;padding:0}
.chg{padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.ctop{display:flex;align-items:baseline;gap:8px}
.who{font-size:11.5px;border-radius:4px;padding:0 6px;color:#fff}
.who.me{background:var(--c1)}.who.cl{background:var(--c3)}
.cname{font-weight:500}
.ctime{margin-left:auto;color:var(--muted);font-size:12px;white-space:nowrap}
.cbody{margin:4px 0;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7}
del{background:rgba(214,51,108,.14);color:var(--mark);text-decoration:line-through}
ins{background:rgba(46,125,79,.16);color:var(--ok);text-decoration:none;font-weight:500}
#toggleHist{margin:4px 0 10px}
.tlhead{display:flex;justify-content:space-between;align-items:baseline;font-weight:500;margin-bottom:6px}
.tlwrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px;padding:4px;background:var(--paper)}
svg.tl{display:block}
.tlcol{fill:transparent;cursor:pointer}.tlcol:hover{fill:var(--soft)}.tlcol.on{fill:var(--hl-fill)}
.tllane{cursor:pointer}
.tlm{stroke:var(--paper);stroke-width:.8}.tlm.me{fill:var(--c1)}.tlm.cl{fill:var(--c3)}
.tla{fill:none;stroke:var(--mark);stroke-width:1.6}.tla.done{stroke:var(--ok)}
.tlnum{font-size:8.5px;fill:var(--ink);font-weight:700}
.legend{font-size:12px;color:var(--muted);margin:6px 0 10px}
.lg{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:3px;vertical-align:middle}
.lg.me{background:var(--c1)}.lg.cl{background:var(--c3)}.lg.an{border:1.6px solid var(--mark);box-sizing:border-box}
details.round{border-top:1px solid var(--line);padding:6px 0}
details.round summary{cursor:pointer;font-size:13.5px}
#modal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.35);display:grid;place-items:center;padding:24px}
.mbox{background:var(--paper);border-radius:10px;max-width:min(1200px,94vw);max-height:88vh;overflow:auto;padding:14px 18px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
#modal[hidden]{display:none}
#list{list-style:none;margin:0;padding:0}
.anno{padding:10px 0;border-bottom:1px solid var(--line)}
.atop{display:flex;align-items:center;gap:8px}
.no{min-width:22px;height:22px;padding:0 4px;box-sizing:border-box;border-radius:11px;background:var(--mark);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.is-done .no{background:var(--ok)}
.kind{font-weight:500;font-size:13.5px}
.anno .where{margin:5px 0 2px;font-size:12.5px;color:var(--muted)}
.txt{margin:4px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.reply{margin:6px 0;padding:6px 10px;border-left:3px solid var(--accent);background:var(--soft);font-size:13.5px;white-space:pre-wrap}
.acts{display:flex;flex-wrap:wrap;gap:12px;margin-top:5px}
.acts button{border:0;background:none;padding:0;color:var(--accent);font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.empty{color:var(--muted);font-size:14px;padding:6px 0}

.imgclip{position:relative;overflow:hidden;width:100%;border-radius:4px;background:#fff}
.imgclip img{position:absolute;max-width:none;display:block;user-select:none;-webkit-user-drag:none}
.srcbox{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)}
.srcbox h4,.stsec h4{margin:0 0 6px;font-size:13px;font-weight:500;color:var(--muted)}
.srcbox textarea{width:100%;box-sizing:border-box;min-height:70px;border:1px solid var(--line);border-radius:5px;padding:5px 7px;background:var(--paper);font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.stsec{padding:10px 0;border-bottom:1px solid var(--line)}
.stsec .form{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
#tab-style .form input[type=text],#tab-style .form input[type=number],#tab-style .form select,.srcbox .form input,.srcbox .form select{width:100%;box-sizing:border-box;min-width:0}
.pal{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pal input[type=color]{width:34px;height:26px;padding:0;border:1px solid var(--line);border-radius:4px;background:none}
.sugg{background:var(--hl-fill);border:1px solid var(--hl-stroke);border-radius:6px;padding:8px 10px;margin:6px 0;font-size:13px}
.sugg .acts{margin-top:4px}
.exlist{list-style:none;margin:6px 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.exlist li{border:1px solid var(--line);border-radius:6px;padding:6px;font-size:12px}
.exlist img{display:block;width:100%;height:80px;object-fit:contain;background:#fff;border-radius:4px}
.exlist input{width:100%;box-sizing:border-box;margin-top:4px;border:1px solid var(--line);border-radius:4px;padding:2px 5px;font-size:12px;background:var(--paper)}
.prop{width:100%;font-size:12.5px;margin:6px 0}
.prop td,.prop th{padding:4px 4px;text-align:left;border-bottom:1px solid var(--line)}
.conf{color:var(--muted);font-size:11.5px}
.expout{width:100%;box-sizing:border-box;min-height:120px;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;border:1px solid var(--line);border-radius:5px;background:var(--paper);margin-top:6px}
#measure{position:absolute;left:-10000px;top:0;visibility:hidden;width:var(--iw)}
#measure .blk{margin:0}
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--paper);padding:5px 10px;border-radius:6px;font-size:12.5px;line-height:1.45;white-space:pre-line;max-width:320px;overflow-wrap:anywhere}
#qc{position:fixed;z-index:55;width:340px;max-width:calc(100vw - 16px);background:var(--paper);border:1px solid var(--line);border-radius:8px;
  box-shadow:0 4px 24px rgba(0,0,0,.18);padding:10px 12px}
#qc .qwhere{margin:0 0 6px;font-size:12.5px;font-weight:500}
#qc .qrow{margin:0 0 8px;font-size:12.5px;color:var(--muted);white-space:pre-line;line-height:1.45;overflow-wrap:anywhere}
#qc textarea{width:100%;box-sizing:border-box;font:inherit;font-size:13px;margin:0 0 8px}
#qc .crow{display:flex;gap:8px;align-items:center}#qc .sp{flex:1}
.flowbar{max-width:var(--pw);margin:0 auto 8px;display:flex;justify-content:flex-end}
#flow.compact .pgsep{font-size:12px;color:var(--muted);margin:14px 0 4px;border-bottom:1px dotted var(--line);padding-bottom:2px}
#flow.compact .cg{display:flex;gap:10px;align-items:flex-start;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:6px 10px;margin:4px 0;cursor:grab}
#flow.compact .cg .hdl{color:var(--muted)}
#flow.compact .cgl{flex:1;min-width:0}
#flow.compact .cgi{display:flex;gap:10px;font-size:13.5px;line-height:1.5}
#flow.compact .cgi.side{padding-left:1.4em}
#flow.compact .cgi.side::before{content:"\21B3";color:var(--muted);margin-left:-1.2em}
#flow.compact .cgi .ty{color:var(--muted);flex:0 0 4.5em;font-size:12px}
#flow.compact .cgi .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.readonly #modes,body.readonly #togglePanel,body.readonly #note-db{display:none!important}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:8px;font-size:14px;max-width:80vw}
@media (max-width:1100px){.wrap{grid-template-columns:1fr}#panel{position:static;max-height:none}}

<body data-mode="view" data-tool="edit" class="nopanel">
<header class="top"><div class="in">
  <h1 id="doc-title">Duetsheet</h1>
  <div class="seg" id="modes" role="group" aria-label="Mode">
    <button type="button" data-mode="view" aria-pressed="true">View</button>
    <button type="button" data-mode="edit" aria-pressed="false">Edit</button>
  </div>
  <span class="hint" id="hint"></span>
  <button type="button" class="btn issues" id="issuesBtn" hidden aria-label="Problems"></button>
  <select id="lang" aria-label="Language"></select>
  <button type="button" class="btn" id="helpBtn" aria-label="Help">?</button>
  <button type="button" class="btn" id="togglePanel">Panel</button>
</div></header>

<div class="wrap">
<main>
  <div id="note-db" hidden><span id="note-text"></span><span id="note-acts"></span></div>
  <div id="agentbar" hidden></div>
  <section id="view" aria-label="View">
    <div id="pagehost"></div>
    <div class="pager">
      <button type="button" class="btn" id="prev">Previous</button>
      <span class="cnt" id="pcount"></span>
      <button type="button" class="btn" id="next">Next</button>
    </div>
    <nav class="thumbs" id="thumbs" aria-label="Pages"></nav>
  </section>
  <section id="edit" aria-label="Edit" hidden>
    <div class="flowbar"><button type="button" class="btn small" id="compactBtn" aria-pressed="false">Reorder (titles only)</button></div>
    <div id="flow"></div>
    <div class="addrow" id="addrow">
      <button type="button" class="btn" data-add="text">Add text</button>
      <button type="button" class="btn" data-add="chart">Add chart</button>
      <button type="button" class="btn" data-add="table">Add table</button>
      <button type="button" class="btn" data-add="image">Add image</button>
      <button type="button" class="btn" data-add="outline">Add contents</button>
      <input type="file" id="imgfile" accept="image/png,image/jpeg,image/webp,image/gif,image/svg+xml,.svg" hidden>
      <input type="file" id="datafile" accept=".csv,.txt,.json,text/csv,text/plain,application/json" hidden>
    </div>
  </section>
</main>
<aside id="panel" aria-label="Panel">
  <div class="tabs" id="tabs" role="tablist">
    <button type="button" role="tab" data-tab="annos" aria-selected="true">Comments</button>
    <button type="button" role="tab" data-tab="changes" aria-selected="false">Changes</button>
    <button type="button" role="tab" data-tab="style" aria-selected="false">Style</button>
    <button type="button" role="tab" data-tab="folder" aria-selected="false" hidden>Folder</button>
  </div>
  <div id="tab-annos">
    <div class="filters" id="filters">
      <button type="button" data-f="all" aria-pressed="true">All</button>
      <button type="button" data-f="open" aria-pressed="false">Open</button>
      <button type="button" data-f="done" aria-pressed="false">Done</button>
    </div>
    <ol id="list"></ol>
  </div>
  <div id="tab-changes" hidden>
    <p class="sum" id="sum"></p>
    <button type="button" class="btn small primary" id="finishRound">Finish this round</button>
    <ol id="curlist" class="chlist"></ol>
    <button type="button" class="btn small" id="toggleHist">Show full history</button>
    <div id="hist" hidden>
      <div class="tlhead"><span>Change timeline</span><button type="button" class="linkbtn" id="zoomTl">Enlarge</button></div>
      <div class="tlwrap" id="tlwrap"></div>
      <p class="legend" id="legendSmall"></p>
      <div id="histlist"></div>
    </div>
  </div>
  <div id="tab-style" hidden></div>
  <div id="tab-folder" hidden></div>
</aside>
</div>
<div id="measure" aria-hidden="true"></div>
<div id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mtitle">
  <div class="mbox"><div class="mhead"><strong id="mtitle"></strong><button type="button" class="btn small" id="mclose">Close</button></div><div id="mbody"></div></div>
</div>
<input type="file" id="langfile" accept=".json,application/json" hidden>
<input type="file" id="reportfile" accept=".json,application/json" hidden>
<div id="tip" hidden></div>
<div id="qc" hidden role="dialog" aria-label="Comment"></div>
<div id="toast" hidden></div>

<script>

/* ---------- Language / i18n ---------- */

function detectLang(){

const masterKeys=()=>Object.keys(I18N['zh-Hant']||{}).filter(k=>!k.startsWith('_'));
const englishOf=k=>/^[a-z]+\|/.test(k)?k.slice(k.indexOf('|')+1):k;

/* ---------- Demo data (fixed random seed, not experimental results) ---------- */
function seedData(){
  let s=20260921;const R=()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  const g=(m,sd)=>m+sd*Math.sqrt(-2*Math.log(1-R()))*Math.cos(2*Math.PI*R());
  const peak=(a,b)=>Math.exp(-(((a-2.6)**2)/(2*.81)+((b-1.4)**2)/(2*.49)));
  const rows=[];
  for(let i=0;i<45;i++){const cycle=Math.floor(i/15)+1;let a,b;
    if(cycle===1){a=R()*5;b=R()*5}else if(cycle===2){a=clamp(g(2.7,1),0,5);b=clamp(g(1.6,1),0,5)}else{a=clamp(g(2.6,.35),0,5);b=clamp(g(1.4,.3),0,5)}

  return {id:'exp',title:tr('Demo experiment data'),columns:[
    {key:'id',label:tr('Run')},{key:'cycle',label:'Cycle'},{key:'a',label:tr('Additive A (wt%)')},{key:'b',label:tr('Additive B (wt%)')},{key:'score',label:tr('Score')}],rows};
}
function nyquistSVG(){
  let d='',pts=[];const Rs=12,Rct=38;
  for(let k=0;k<=60;k++){const w=10**(4-k*0.1);const zr=Rs+Rct/(1+(w*0.0009)**2);const zi=Rct*(w*0.0009)/(1+(w*0.0009)**2);pts.push([zr,zi])}
  for(let k=1;k<=18;k++){const z=Rs+Rct+k*2.2;pts.push([z,k*2.2+0.6*Math.sin(k)])}
  const X=v=>70+(v-0)*7.6,Y=v=>330-v*7.6;
  d=pts.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' ');
  const dots=pts.filter((p,i)=>i%3===0).map(p=>`<circle cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="3.2" fill="#1F6F8B"/>`).join('');
  let grid='';for(let v=0;v<=90;v+=10){grid+=`<line x1="${X(v)}" y1="30" x2="${X(v)}" y2="330" stroke="#dde3e6"/><text x="${X(v)}" y="350" font-size="12" text-anchor="middle" fill="#5a6b75">${v}</text>`}
  for(let v=0;v<=40;v+=10){grid+=`<line x1="70" y1="${Y(v)}" x2="${X(90)}" y2="${Y(v)}" stroke="#dde3e6"/><text x="60" y="${Y(v)+4}" font-size="12" text-anchor="end" fill="#5a6b75">${v}</text>`}
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 0 800 380"><rect width="800" height="380" fill="#ffffff"/>${grid}<path d="${d}" fill="none" stroke="#1F6F8B" stroke-width="2"/>${dots}<text x="400" y="374" font-size="13" text-anchor="middle" fill="#13232c">Z' (Ω)</text><text transform="rotate(-90 20 180)" x="20" y="180" font-size="13" text-anchor="middle" fill="#13232c">−Z'' (Ω)</text><text x="760" y="50" font-size="13" text-anchor="end" fill="#b83b5e">${tr('Demo figure, not measured')}</text></svg>`;
  return 'data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(svg)));
}

/* ---------- In-memory database: same interface when cloud storage is unavailable ---------- */
function memDB(initial,onWrite){
  const docs=new Map(Object.entries(initial||{})),subs=new Set();const fire=()=>setTimeout(()=>subs.forEach(f=>f()));
  const touch=p=>{fire();if(onWrite)onWrite(p)};
  const snap=p=>{const d=docs.get(p);return{id:p.split('/').pop(),exists:!!d,data:()=>d?JSON.parse(JSON.stringify(d)):undefined,metadata:{}}};
  const docRef=p=>({id:p.split('/').pop(),path:p,
    async get(){return snap(p)},
    async set(d){docs.set(p,JSON.parse(JSON.stringify(d)));touch(p)},
    async update(d){if(!docs.has(p))throw{code:'invalid_argument'};docs.set(p,{...docs.get(p),...JSON.parse(JSON.stringify(d))});touch(p)},
    async delete(){docs.delete(p);touch(p)},
    onSnapshot(next){const f=()=>next(snap(p));subs.add(f);setTimeout(f);return()=>subs.delete(f)}});
  const col=c=>{const q={orderBy(){return q},limit(){return q},doc:id=>docRef(c+'/'+id),
    onSnapshot(next){const f=()=>{const ds=[...docs.keys()].filter(k=>k.startsWith(c+'/')&&k.split('/').length===c.split('/').length+1).map(snap);next({docs:ds,size:ds.length,empty:!ds.length})};subs.add(f);setTimeout(f);return()=>subs.delete(f)}};return q};
  return{doc:docRef,collection:col,dump:()=>Object.fromEntries(docs),load(o){docs.clear();Object.entries(o).forEach(([k,v])=>docs.set(k,v));fire()}};
}

/* ---------- Charts ---------- */
const PALETTE=['--c1','--c2','--c3','--c4','--c5','--c0'];
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const ramp=t=>`hsl(${Math.round(38+162*clamp(t,0,1))},72%,48%)`;
function niceStep(span,n){const s0=span/n,m=10**Math.floor(Math.log10(s0||1)),e=s0/m;return(e>=7.5?10:e>=3.5?5:e>=1.5?2:1)*m}
function linAxis(vals,lo,hi){
  let a=lo??Math.min(...vals),b=hi??Math.max(...vals);if(!(b>a)){a-=1;b+=1}
  const st=niceStep(b-a,5);if(lo==null)a=Math.floor(a/st)*st;if(hi==null)b=Math.ceil(b/st)*st;
  const t=[];for(let v=Math.ceil(a/st-1e-9)*st;v<=b+st*1e-9;v+=st)t.push(+v.toPrecision(12));
  return{lo:a,hi:b,ticks:t,log:false};
}
function logAxis(vals,lo,hi){
  const pos=vals.filter(v=>v>0);if(!pos.length)return linAxis(vals,lo,hi);
  const a=lo>0?lo:10**Math.floor(Math.log10(Math.min(...pos))),b=hi>0?hi:10**Math.ceil(Math.log10(Math.max(...pos)));
  const t=[];for(let e=Math.floor(Math.log10(a));e<=Math.ceil(Math.log10(b));e++)[1,2,5].forEach(m=>{const v=m*10**e;if(v>=a*0.999&&v<=b*1.001)t.push(+v.toPrecision(12))});
  return{lo:a,hi:b===a?a*10:b,ticks:t,log:true};
}
function marker(k,cx,cy,r){

/* ---------- Images ---------- */
const imgCache=new Map(),imgDims=new Map();let rerenderT;
function loadImg(src){if(imgCache.has(src))return imgCache.get(src);
  const p=new Promise((res,rej)=>{const i=new Image();i.onload=()=>{const first=!imgDims.has(src);imgDims.set(src,{w:i.naturalWidth||800,h:i.naturalHeight||600});
    if(first){clearTimeout(rerenderT);rerenderT=setTimeout(render,30)}res(i)};i.onerror=rej;i.src=src});imgCache.set(src,p);return p}
const ASSET_ID=/^[0-9a-f]{32}$/;

  if(!url){wrap.append(h('p',{class:'cap',text:tr('No image, or the format is not supported.')}));return}
  const cr=im.crop||{t:0,r:0,b:0,l:0};const G={b,space:'image',wrap};S.geo[b.id]=G;
  const setup=(w,hh)=>{
    const fx=Math.max(.05,1-((cr.l||0)+(cr.r||0))/100),fy=Math.max(.05,1-((cr.t||0)+(cr.b||0))/100),cw=w*fx,ch=hh*fy;
    wrap.style.width=`min(${pct}%, calc(var(--chartmax) * ${(cw/ch).toFixed(4)}))`;
    const clip=h('div',{class:'imgclip',style:`aspect-ratio:${cw.toFixed(2)} / ${ch.toFixed(2)}`});
    const img=h('img',{src:url,alt:b.caption||b.title||'',draggable:'false',
      style:`width:${(100/fx).toFixed(4)}%;height:${(100/fy).toFixed(4)}%;left:${(-(cr.l||0)/fx).toFixed(4)}%;top:${(-(cr.t||0)/fy).toFixed(4)}%`});

}

/* ---------- Tables ---------- */
function buildTable(b,host){

  const key=r=>numv(r[t.sortBy]);
  const rows=[...ds.rows].sort((p,q)=>{const a=key(p),b=key(q);return a==null?(b==null?0:1):b==null?-1:(t.desc?-1:1)*(a-b)}).slice(0,clamp(t.limit||5,1,50)); // empty cells last

    h('tbody',{},rows.map(r=>h('tr',{'data-row':r.id},cols.map(c=>h('td',{text:c.key==='id'?'#'+r[c.key]:fmt(r[c.key])})))))]);

/* ---------- Blocks (view style) ---------- */
function buildViewBlock(b,interactive){
  const d=h('div',{class:'blk','data-id':b.id});
  if(b.title)d.append(h('h2',{class:'btitle',text:b.title}));
  if(b.type==='text')d.append(h('div',{class:'md',html:md(b.text)}));
  else if(b.type==='chart'){const svg=el('svg',{});d.append(svg);const G=drawChart(svg,b);if(G){S.geo[b.id]=G;if(interactive)bindDraw(G,svg)}}
  else if(b.type==='table')buildTable(b,d);
  else if(b.type==='image')buildImage(b,d,interactive);
  else if(b.type==='outline')d.append(buildOutline(b));
  if(b.caption&&b.type!=='text'&&b.type!=='outline')d.append(h('p',{class:'cap',text:b.caption}));
  const src=sourceLine(b);if(src)d.append(src);
  return d;
}
/* Outline: the titled blocks after this one, with their page; text titles are headings, figure and table titles sit under them */
function buildOutline(b){
  const all=orderedBlocks(),rest=all.slice(all.findIndex(x=>x.id===b.id)+1).filter(x=>x.title&&x.type!=='outline');
  if(!rest.length)return h('p',{class:'cap',text:tr('Blocks with a title after this one will be listed here.')});
  let under=false; // indent figures and tables only once a heading is above them
  return h('ol',{class:'toc'},rest.map(x=>{const p=pageOfBlock(x.id);if(x.type==='text')under=true;
    return h('li',{class:under&&x.type!=='text'?'l2':'l1'},[
      h('button',{type:'button',class:'tocl',text:x.title,onclick:()=>jumpTo(x.id)}),
      h('span',{class:'lead'}),h('span',{class:'pg',text:p>=0?String(p+1):''})])}));
}
/* Blocks that stay together. "avoid" goes under the previous block; "beside" starts a right-hand column next to the group. */
function blockGroups(blocks){
  const groups=[];
  blocks.forEach(b=>{const bb=b.breakBefore||'auto',g=groups[groups.length-1];
    if(g&&bb==='beside'){g.side.push(b);g.last=g.side}
    else if(g&&bb==='avoid')g.last.push(b);
    else{const main=[b];groups.push({main,side:[],last:main,force:bb==='page'})}});
  groups.forEach(g=>{g.blocks=[...g.main,...g.side];delete g.last});
  return groups;

function buildGroup(g,interactive){

  const col=(cls,list)=>h('div',{class:'col '+cls},list.map(b=>buildViewBlock(b,interactive)));
  return [h('div',{class:'duo'},[col('main',g.main),col('side',g.side)])];
}

/* ---------- Pagination: pages are computed from content, never stored ---------- */
function orderedBlocks(){const ids=(S.meta&&S.meta.order)||[];const seen=new Set();
  const out=ids.map(id=>S.blocks.get(id)).filter(b=>b&&!seen.has(b.id)&&seen.add(b.id));
  [...S.blocks.values()].filter(b=>!seen.has(b.id)).sort((p,q)=>(p.createdAt||'')<(q.createdAt||'')?-1:1).forEach(b=>out.push(b));
  return out}
function paginate(){
  const L=layoutVars();const blocks=orderedBlocks();const mh=$('#measure');mh.replaceChildren();
  const saveGeo=S.geo;S.geo={};
  const groups=blockGroups(blocks);
  const nodes=groups.map(g=>{const n=buildGroup(g,false);mh.append(...n);return n});
  const hts=new Map();$$('.blk',mh).forEach(n=>hts.set(n.dataset.id,n.getBoundingClientRect().height));
  const ghs=groups.map((g,i)=>g.side.length?nodes[i][0].getBoundingClientRect().height:
    g.blocks.reduce((s,b)=>s+(hts.get(b.id)||0),0)+L.gap*(g.blocks.length-1));
  mh.replaceChildren();S.geo=saveGeo;
  const pages=[];let cur=[],hsum=0;
  groups.forEach((g,i)=>{const gh=ghs[i];
    const need=cur.length?hsum+L.gap+gh:gh;
    if(cur.length&&(g.force||need>L.innerH+1)){pages.push(cur);cur=[];hsum=0}
    hsum=cur.length?hsum+L.gap+gh:gh;cur.push(...g.blocks)});
  if(cur.length)pages.push(cur);
  S.pages=pages;S.heights=hts;S.innerH=L.innerH;
  S.starts=new Map();pages.forEach((p,i)=>S.starts.set(p[0].id,i));
  S.page=clamp(S.page,0,Math.max(0,pages.length-1));
}
function pageOfBlock(id){return (S.pages||[]).findIndex(p=>p.some(b=>b.id===id))}

/* ---------- View mode ---------- */
function renderView(){

  const blocks=S.pages[S.page]||[];
  const pg=h('div',{class:'page'});const inner=h('div',{class:'inner'});pg.append(inner);
  blockGroups(blocks).forEach(g=>inner.append(...buildGroup(g,false)));

function fitPage(inner,blocks){

    cur=Math.max(160,cur-over/visuals-4);inner.style.setProperty('--chartmax',cur+'px');if(cur===160)break}

function tokens(s){return String(s??'').match(/[\u3000-\u9fff\uff00-\uffef]|[A-Za-z0-9_.%+\u00c0-\u024f\uac00-\ud7af-]+|\s+|[\s\S]/g)||[]}
function diffNodes(a,b){
  const A=tokens(a),B=tokens(b),n=A.length,m=B.length;
  if(n*m>1.2e6)return[h('del',{text:String(a??'')}),h('br'),h('ins',{text:String(b??'')})];
  const L=Array.from({length:n+1},()=>new Uint16Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=A[i]===B[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  const out=[];let i=0,j=0,buf='',mode='';
  const flush=()=>{if(!buf)return;out.push(mode==='='?document.createTextNode(buf):h(mode==='-'?'del':'ins',{text:buf}));buf=''};
  const pushTok=(md,t)=>{if(md!==mode){flush();mode=md}buf+=t};
  while(i<n&&j<m){if(A[i]===B[j]){pushTok('=',A[i]);i++;j++}else if(L[i+1][j]>=L[i][j+1]){pushTok('-',A[i]);i++}else{pushTok('+',B[j]);j++}}
  while(i<n)pushTok('-',A[i++]);while(j<m)pushTok('+',B[j++]);flush();
  return out;
}
function summaryOf(list){const cnt={};list.forEach(c=>{const k=category(c.field);cnt[k]=(cnt[k]||0)+1});
  const parts=Object.entries(cnt).map(([k,v])=>k===tr('Order')?tr('reordered {n}×',{n:v}):tr('{k}: {n}',{k:tr(k),n:v}));return parts.length?parts.join(tr(', ')):tr('No changes')}

function drawTarget(G,t,g,cls){

    if(t.xKey!==G.xKey||t.yKey!==G.yKey)return null;

  if(t.kind==='box'){const x0=G.sx(t.x[0]),x1=G.sx(t.x[1]),y0=G.sy(t.y[1]),y1=G.sy(t.y[0]);

  if(t.kind==='lasso'){const p=t.polygon.map(q=>[G.sx(q[0]),G.sy(q[1])]);el('path',{class:cls,d:'M'+p.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' L')+' Z'},g);

function polyArea(p){let s=0;for(let i=0;i<p.length;i++){const q=p[(i+1)%p.length];s+=p[i][0]*q[1]-q[0]*p[i][1]}return Math.abs(s)/2}
function decimate(p,n){if(p.length<=n)return p;const st=(p.length-1)/(n-1),o=[];for(let i=0;i<n;i++)o.push(p[Math.round(i*st)]);return o}
function inPoly(x,y,P){let c=false;for(let i=0,j=P.length-1;i<P.length;j=i++){const[xi,yi]=P[i],[xj,yj]=P[j];if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)c=!c}return c}
function bindDraw(G,svg){
  let d=null;
  const active=()=>S.mode==='edit'&&S.draw&&S.draw.blockId===G.b.id;
  const loc=e=>{const r=svg.getBoundingClientRect();return[clamp((e.clientX-r.left)*G.W/r.width,G.plot.x0,G.plot.x1),clamp((e.clientY-r.top)*G.H/r.height,G.plot.y0,G.plot.y1)]};
  svg.addEventListener('pointerdown',e=>{
    if(e.button!==0||!active())return;
    const p0=loc(e);if(G.space==='data'){const r=svg.getBoundingClientRect(),x=(e.clientX-r.left)*G.W/r.width,y=(e.clientY-r.top)*G.H/r.height;
      if(x<G.plot.x0||x>G.plot.x1||y<G.plot.y0||y>G.plot.y1)return}
    e.preventDefault();svg.setPointerCapture(e.pointerId);d={tool:S.draw.tool,start:p0,cur:p0,pts:[p0]};live()});
  svg.addEventListener('pointermove',e=>{if(!d)return;const p=loc(e);d.cur=p;if(d.tool==='lasso'){const l=d.pts[d.pts.length-1];if(Math.hypot(p[0]-l[0],p[1]-l[1])>=(G.space==='image'?G.W/200:3))d.pts.push(p)}live()});
  const end=e=>{if(!d)return;const dd=d;d=null;G.live.replaceChildren();if(e.type==='pointerup')finish(dd,e)};
  svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end);
  function live(){G.live.replaceChildren();if(d.tool==='box'){el('rect',{class:'shape pendshape',x:Math.min(d.start[0],d.cur[0]),y:Math.min(d.start[1],d.cur[1]),width:Math.abs(d.cur[0]-d.start[0]),height:Math.abs(d.cur[1]-d.start[1])},G.live)}
    else if(d.pts.length>1)el('path',{class:'shape pendshape',d:'M'+d.pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' L')+' Z'},G.live)}
  function finish(dd,ev){
    const scale=G.space==='image'?G.W/680:1;
    const base={blockId:G.b.id,space:G.space};if(G.space==='data'){base.xKey=G.xKey;base.yKey=G.yKey}
    const inside=G.space==='data'?(pred=>G.rows.filter(r=>pred(+r[G.xKey],+r[G.yKey])).map(r=>r.id)):null;
    let t;
    if(dd.tool==='box'){const[x0,y0]=dd.start,[x1,y1]=dd.cur;
      if(Math.abs(x1-x0)<6*scale||Math.abs(y1-y0)<6*scale){toast(tr('Area too small. Drag a larger rectangle'));return}
      const xa=[G.ix(Math.min(x0,x1)),G.ix(Math.max(x0,x1))],ya=[G.iy(y0),G.iy(y1)].sort((p,q)=>p-q);
      t={...base,kind:'box',x:xa.map(r3),y:ya.map(r3)};
      if(inside)t.enclosed=inside((x,y)=>x>=xa[0]&&x<=xa[1]&&y>=ya[0]&&y<=ya[1]);
    }else{
      if(dd.pts.length<8||polyArea(dd.pts)<300*scale*scale){toast(tr('Lasso too small. Draw a larger closed shape'));return}
      const poly=decimate(dd.pts,48).map(p=>[r3(G.ix(p[0])),r3(G.iy(p[1]))]);
      t={...base,kind:'lasso',polygon:poly};if(inside)t.enclosed=inside((x,y)=>inPoly(x,y,poly));
    }
    draftOf(G.b.id).target=t;S.draw=null;document.body.dataset.draw='';render();
    openQuick(G.b.id,ev.clientX,ev.clientY);
  }
}

/* ---------- Reading JSON written by other programs ---------- */
// Python writes NaN and Infinity, and some Windows tools start a file with a byte order mark; browsers accept neither.
function lenientJSON(text){
  if(text.charCodeAt(0)===0xFEFF)text=text.slice(1);
  try{return{value:JSON.parse(text),fixed:0}}catch(e0){
    let out='',inStr=false,n=0;
    for(let i=0;i<text.length;i++){const c=text[i];
      if(inStr){out+=c;if(c==='\\'){out+=text[i+1]||'';i++}else if(c==='"')inStr=false;continue}
      if(c==='"'){inStr=true;out+=c;continue}
      if(c==='N'&&text.startsWith('NaN',i)){out+='null';i+=2;n++;continue}
      if(c==='I'&&text.startsWith('Infinity',i)){out+='null';i+=7;n++;continue}
      if(c==='-'&&text.startsWith('-Infinity',i)){out+='null';i+=8;n++;continue}
      out+=c}
    if(n){try{return{value:JSON.parse(out),fixed:n}}catch(e1){throw{json:true,message:e1.message,text:out}}} // the real problem is elsewhere
    throw{json:true,message:e0.message,text}}
}
function jsonDetail(err){
  if(!err||!err.json)return errText(err);const m=/position (\d+)/.exec(err.message||'');if(!m)return err.message;
  const pos=+m[1],before=err.text.slice(0,pos),line=before.split('\n').length,col=pos-before.lastIndexOf('\n');
  return tr('line {l}, column {c}',{l:line,c:col})+': '+err.message+'\n'+err.text.slice(Math.max(0,pos-40),pos+40).replace(/\s+/g,' ');
}
function readReport(text,label){ // report.json text -> documents; what could be repaired is logged as a warning
  let r;try{r=lenientJSON(text)}catch(e){throw{msg:tr('{file} is not valid JSON.',{file:label}),detail:jsonDetail(e)}}
  let docs;try{docs=docsFromReport(r.value)}catch(e){throw{msg:tr('{file} is not a Duetsheet report: the "report" section with "meta" is missing.',{file:label})}}
  if(r.fixed)logIssue('warning',tr('{file} had {n} values that are not valid JSON (NaN or Infinity). They were read as empty values.',{file:label,n:r.fixed}),
    tr('Ask your agent to write null instead (in Python: json.dump(..., allow_nan=False)).'));
  return docs;
}

/* ---------- Launcher (python duetsheet.py) ---------- */
// When duetsheet.py serves the page, the folder it was started in is reached through it, with no folder picker.
// httpRoot() offers the part of the File System Access API that the folder code uses, so that code stays the same.
function httpRoot(token,name){
  const call=(path,opt)=>fetch('/fs/'+path.split('/').map(encodeURIComponent).join('/'),{...(opt||{}),headers:{'X-Duetsheet-Token':token}});
  const missing=n=>new DOMException(n+' not found','NotFoundError');
  const file=(path,fname,meta)=>({kind:'file',name:fname,meta,
    async getFile(){const r=await call(path);if(r.status===404)throw missing(fname);if(!r.ok)throw new Error(fname+': '+r.status+' '+await r.text());
      return new File([await r.blob()],fname,{type:r.headers.get('Content-Type')||'',lastModified:+r.headers.get('X-Mtime')||Date.now()})},
    async mtime(){const r=await call(path,{method:'HEAD'});if(!r.ok)throw missing(fname);return +r.headers.get('X-Mtime')},
    async createWritable(){const parts=[];return{async write(d){parts.push(d)},
      async close(){const r=await call(path,{method:'PUT',body:new Blob(parts)});if(!r.ok)throw new Error(r.status+' '+await r.text())}}}});
  const dir=(path,dname)=>({kind:'directory',name:dname,virtual:true,
    async getFileHandle(n,o){const p=path+n,r=await call(p,{method:'HEAD'});
      if(!r.ok){if(!(o&&o.create))throw missing(n);const w=await call(p,{method:'PUT',body:''});if(!w.ok)throw new Error(w.status+' '+await w.text())} // like the real API: create an empty file
      return file(p,n)},
    async getDirectoryHandle(n,o){const p=path+n+'/',r=await call(p,{method:o&&o.create?'POST':'HEAD'});if(!r.ok)throw missing(n);return dir(p,n)},
    async *entries(){const r=await call(path);if(!r.ok)return;
      for(const x of await r.json())yield[x.name,x.kind==='file'?file(path+x.name,x.name,{size:x.size,lastModified:x.mtime}):dir(path+x.name+'/',x.name)]},
    async queryPermission(){return'granted'},async requestPermission(){return'granted'}});
  return dir('',name);
}
async function connectServer(){
  if(!/^https?:$/.test(location.protocol))return false;
  const m=/token=([0-9a-f]{16,})/.exec(location.hash);let token=m&&m[1];
  try{if(token){sessionStorage.setItem('duetsheet-token',token);history.replaceState(null,'',location.pathname+location.search)}else token=sessionStorage.getItem('duetsheet-token')}catch(e){}
  if(!token)return false;
  let info;try{const r=await fetch('/api/info',{headers:{'X-Duetsheet-Token':token}});if(!r.ok)return false;info=await r.json()}catch(e){return false}
  S.server={info,token,log:e=>fetch('/api/log',{method:'POST',headers:{'X-Duetsheet-Token':token,'Content-Type':'application/json'},body:JSON.stringify(e)}).catch(()=>{})};
  LOG.forEach(e=>S.server.log(e)); // problems logged before the connection
  await openFolder(httpRoot(token,info.name),false);
  if(!S.folder)renderLocalBar();
  pollAgent();setInterval(pollAgent,2000); // is an agent listening, and what is it doing
  return true;
}

/* ---------- Local project folder ---------- */
// In browsers with the File System Access API (Chrome, Edge) a report can live in a folder on disk:
//   report.json  the report: { "schema": ..., "<collection>": { "<id>": document } }
//   assets/      uploaded images and files, named <asset id>.<ext>
//   data/        raw data put there by the user or an agent; imported into datasets with their source recorded
//                (in a raw data folder, the raw data is the folder itself, outside duetsheet/)
//   derived_data/, scripts/  tables computed from the raw data and the scripts that compute them (see steps, the data chain)
//   habits/      example figures, .mplstyle files and profile.json, used to learn the user's figure style
//   exports/     files the page exports (styles, report copies, translation templates)
//   lang/        extra interface translations
// An agent can edit report.json while the page is open: the page reloads it, and merges by document when both wrote.
const FS_OK=typeof window.showDirectoryPicker==='function';
const REPORT_FILE='report.json',SCHEMA='duetsheet/0.6';
const DATA_EXT=/\.(csv|tsv|txt|json)$/i,HABIT_EXT=/\.(svg|mplstyle|png|jpe?g|webp|gif|json)$/i,WRITE_EXT=/\.(md|txt|docx|pdf)$/i;
const ASSET_EXT={'image/svg+xml':'svg','image/png':'png','image/jpeg':'jpg','image/webp':'webp','image/gif':'gif','text/csv':'csv','text/plain':'txt','application/json':'json'};
function docsFromReport(j){
  if(!j||typeof j!=='object'||Array.isArray(j))throw{code:'bad_report'};
  const out={};
  for(const[c,docs]of Object.entries(j)){if(c==='schema'||!docs||typeof docs!=='object'||Array.isArray(docs))continue;
    for(const[id,d]of Object.entries(docs))if(d&&typeof d==='object'&&!Array.isArray(d))out[c+'/'+id]=d}
  if(!out['report/meta'])throw{code:'bad_report'};
  return out;
}
function reportFromDocs(docs){const j={schema:SCHEMA};
  Object.keys(docs).sort().forEach(p=>{const i=p.indexOf('/'),c=p.slice(0,i);(j[c]||(j[c]={}))[p.slice(i+1)]=docs[p]});return j}
function reportFromState(){ // the report as shown now, in report.json form (same in every storage mode)
  const d={'report/meta':S.meta};
  S.blocks.forEach((b,id)=>{d['blocks/'+id]=b});S.datasets.forEach((x,id)=>{d['datasets/'+id]=x});
  S.annos.forEach(a=>{d['annotations/'+a.id]=a});S.changes.forEach(c=>{d['changes/'+c.id]=c});S.rounds.forEach(r=>{d['rounds/'+r.id]=r});
  S.examples.forEach(x=>{d['examples/'+x.id]=x});S.steps.forEach((x,id)=>{d['steps/'+id]=x});if(S.style)d['style/profile']=S.style;if(S.writing)d['style/writing']=S.writing;
  return reportFromDocs(d);
}
const hex=buf=>[...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
const hexId=()=>hex(crypto.getRandomValues(new Uint8Array(16)));
const sha256=async buf=>hex(await crypto.subtle.digest('SHA-256',buf));
async function subdir(dir,name,create){try{return await dir.getDirectoryHandle(name,{create:!!create})}catch(e){return null}}
async function listFiles(d,re){const out=[];if(!d)return out;
  for await(const[name,hd]of d.entries())if(hd.kind==='file'&&(!re||re.test(name)))out.push(hd);
  return out.sort((a,b)=>a.name<b.name?-1:1)}
async function writeFile(d,name,data){const fh=await d.getFileHandle(name,{create:true});const w=await fh.createWritable();await w.write(data);await w.close();return fh}
const idb={ // remembers the last folder between visits (the browser asks again for permission)
  open(){return this.p||(this.p=new Promise((res,rej)=>{const r=indexedDB.open('duetsheet',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))},
  async run(mode,fn){const d=await this.open();return new Promise((res,rej)=>{const t=d.transaction('kv',mode);const q=fn(t.objectStore('kv'));t.oncomplete=()=>res(q.result);t.onerror=()=>rej(t.error)})},
  get(k){return this.run('readonly',s=>s.get(k))},set(k,v){return this.run('readwrite',s=>s.put(v,k))}};

async function folderDB(dir,seedDocs){
  let fh=null,known=0,docs=null,retry=0,retryT=null,bad=null;
  try{fh=await dir.getFileHandle(REPORT_FILE);const f=await fh.getFile();docs=readReport(await f.text(),REPORT_FILE);known=f.lastModified}
  catch(e){if(!(e&&e.name==='NotFoundError'))throw e}
  const stamp=async()=>fh.mtime?await fh.mtime():(await fh.getFile()).lastModified;
  const dirty=new Set();let timer=null,busy=false;
  const mem=memDB(docs||seedDocs||{},p=>{dirty.add(p);setSave('pending');clearTimeout(timer);timer=setTimeout(flush,400)});
  async function flush(){
    if(busy){clearTimeout(timer);timer=setTimeout(flush,200);return}
    if(!dirty.size)return;busy=true;const mine=new Set(dirty);dirty.clear();clearTimeout(retryT);
    try{fh=fh||await dir.getFileHandle(REPORT_FILE,{create:true});
      const f=await fh.getFile();let all=mem.dump();
      if(f.size&&f.lastModified!==known){ // someone else wrote the file since we read it: keep their documents, put ours on top
        const text=await f.text();let next=null;
        try{next=readReport(text,REPORT_FILE)}catch(e){ // unreadable: keep a copy of it, then save ours
          const copy='report-unreadable-'+new Date().toISOString().replace(/[:.]/g,'-')+'.json';
          try{await writeFile(await subdir(dir,'exports',true),copy,text)}catch(x){}
          logIssue('error',e.msg,(e.detail?e.detail+'\n':'')+tr('Your changes were saved over it. The unreadable file was kept as exports/{f}.',{f:copy}))}
        if(next){mine.forEach(p=>{if(p in all)next[p]=all[p];else delete next[p]});all=next;mem.load(all)}}
      await writeFile(dir,REPORT_FILE,JSON.stringify(reportFromDocs(all),null,1)+'\n');
      known=await stamp();retry=0;setSave(dirty.size?'pending':'saved')}
    catch(e){mine.forEach(p=>dirty.add(p));setSave('error',e);
      if(!retry)logIssue('error',tr('Could not save report.json. Duetsheet keeps trying.'),errText(e));
      retry++;retryT=setTimeout(flush,Math.min(30000,2000*2**(retry-1)))} // sync clients such as OneDrive can lock a file for a moment
    finally{busy=false}
  }
  async function poll(){
    if(busy||dirty.size)return;
    try{fh=fh||await dir.getFileHandle(REPORT_FILE);if(await stamp()===known)return;
      const f=await fh.getFile();let next;
      try{next=readReport(await f.text(),REPORT_FILE)}
      catch(e){ // perhaps half-written: report it only when it is still unreadable on the next check
        if(bad&&bad.m===f.lastModified){if(!bad.logged){bad.logged=true;logIssue('error',e.msg,(e.detail?e.detail+'\n':'')+tr('The page keeps showing the last version it could read.'))}}
        else bad={m:f.lastModified};
        return}
      bad=null;known=f.lastModified;await loadAssetURLs(dir);mem.load(next);
      toast(tr('report.json changed on disk; the page has been updated.'));refreshFolderFiles()}
    catch(e){} // no report.json yet
  }
  const iv=setInterval(poll,1500);
  if(!docs){dirty.add('report/meta');await flush()} // a new folder gets its report.json right away
  return{...mem,name:dir.name,dir,flush,pending:()=>dirty.size>0||busy,close(){clearInterval(iv);clearTimeout(timer);clearTimeout(retryT)}};
}
async function loadAssetURLs(dir){
  for(const fh of await listFiles(await subdir(dir,'assets'))){const id=fh.name.replace(/\.[^.]+$/,'');
    if(ASSET_ID.test(id)&&!S.assetURL.has(id))S.assetURL.set(id,URL.createObjectURL(await fh.getFile()))}}
function folderCaps(dir){return{
  assets:{async upload(blob,opt){const type=(opt&&opt.type)||blob.type||'application/octet-stream',id=hexId();
      await writeFile(await subdir(dir,'assets',true),id+'.'+(ASSET_EXT[type]||'bin'),blob);return{id,url:URL.createObjectURL(blob),contentType:type,sizeBytes:blob.size}},
    async delete(){}}, // files stay in assets/: the change log may still point to them
  downloads:{async save(r){const name=String(r.filename).replace(/\.mplstyle\.txt$/,'.mplstyle');
    await writeFile(await subdir(dir,'exports',true),name,r.data);return{status:'saved',path:'exports/'+name}}},
  sample:null}}
function starterDocs(name){const t=now(),id='b-start';

  Object.assign(S,{meta:null,blocks:new Map(),datasets:new Map(),annos:[],changes:[],rounds:[],steps:new Map(),fstate:null,newInputs:null,writing:null,writingProposal:null,writingStats:null,style:null,examples:[],agentProposal:null,proposal:null,drafts:new Map(),page:0,stale:new Set(),folderFiles:null});

async function pickFolder(){let dir;try{dir=await window.showDirectoryPicker({mode:'readwrite',id:'duetsheet'})}catch(e){return}await openFolder(dir,true)}
async function openFolder(root,ask){
  try{
    if(root.requestPermission&&await root.requestPermission({mode:'readwrite'})!=='granted'){fail(tr('Permission to use the folder was not granted.'));return}
    // One rule for every way of opening a folder: a folder with report.json is the project folder (raw data in data/);
    // any other folder is a raw data folder, and the report goes into its duetsheet/ subfolder.
    const has=async d=>!!d&&await d.getFileHandle(REPORT_FILE).then(()=>true,()=>false);
    let dir=root,dataDir,prefix;
    if(await has(root)){dataDir=await subdir(root,'data');prefix='data/'}
    else{dir=await root.getDirectoryHandle('duetsheet',{create:true});dataDir=root;prefix='../'}
    let seed=null;
    if(!await has(dir))seed=ask&&S.meta&&S.blocks.size&&confirm(tr('This folder has no report yet. Save the report that is open now into it? Cancel starts an empty report.'))
      ?docsFromReport(reportFromState()):starterDocs(root.name);
    const f=await folderDB(dir,seed);
    if(S.folder)S.folder.close();
    Object.assign(f,{name:root.name,root,dataDir,prefix,file:prefix==='../'?'duetsheet/'+REPORT_FILE:REPORT_FILE});
    S.folder=f;S.lastFolder=root;S.caps=folderCaps(dir);S.assetURL=new Map();await loadAssetURLs(dir);
    useDB(f);await loadFolderLangs(dir);
    if(!root.virtual)try{await idb.set('folder',root)}catch(e){}
    S.tab='folder';S.panelInView=true;document.body.classList.remove('nopanel');
    renderLocalBar();refreshFolderFiles();toast(tr('Opened folder {name}',{name:root.name}))}
  catch(e){fail(e&&e.msg?e.msg:tr('Could not open the folder ({m}).',{m:errText(e)||tr('unknown')}),e&&e.detail)}
}

/* data/: raw data imported into datasets, with the source file recorded */
async function listDeep(d,re,base,depth,out){ // data files in the raw data folder and its subfolders, Duetsheet's own folder skipped
  out=out||[];base=base||'';depth=depth||0;if(!d||depth>3)return out;
  for await(const[name,hd]of d.entries()){if(out.length>=300)break;
    if(name.startsWith('.')||(!depth&&name==='duetsheet')||name==='node_modules'||name==='__pycache__')continue;
    if(hd.kind==='file'){if(re.test(name))out.push({fh:hd,rel:base+name})}else await listDeep(hd,re,base+name+'/',depth+1,out)}
  return out;
}
async function refreshFolderFiles(){
  if(!S.folder)return;const F=S.folder,dir=F.dir;
  const found=(await listDeep(F.dataDir,DATA_EXT)).sort((a,b)=>a.rel<b.rel?-1:1);
  const data=await Promise.all(found.map(async({fh,rel})=>{const f=fh.meta||await fh.getFile();
    return{name:rel,path:F.prefix+rel,fh,size:f.size,modified:new Date(f.lastModified).toISOString()}}));
  const hd=await subdir(dir,'habits'); // figure examples in habits/ (older projects) and habits/figures/; the user's own texts in habits/writing/
  const habits=[...(await listFiles(hd,HABIT_EXT)).map(fh=>fh.name),...(await listFiles(await subdir(hd,'figures'),HABIT_EXT)).map(fh=>'figures/'+fh.name)];
  const writing=await listFiles(await subdir(hd,'writing'),WRITE_EXT);
  const der=(await listDeep(await subdir(dir,'derived_data'),DATA_EXT,'derived_data/')).sort((a,b)=>a.rel<b.rel?-1:1);
  const derived=await Promise.all(der.map(async({fh,rel})=>{const f=fh.meta||await fh.getFile();
    return{name:rel,path:rel,fh,size:f.size,modified:new Date(f.lastModified).toISOString()}}));
  S.folderFiles={data,derived,habits,writing};renderPanel();
  scheduleVerify(); // whether imported files changed: see verifyChain()
}
function parseDelimited(txt){
  const first=txt.split(/\r?\n/,1)[0];const d=[',','\t',';'].map(c=>[c,first.split(c).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<txt.length;i++){const ch=txt[i];
    if(q){if(ch==='"'){if(txt[i+1]==='"'){cell+='"';i++}else q=false}else cell+=ch}
    else if(ch==='"')q=true;else if(ch===d){row.push(cell);cell=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&txt[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell=''}
    else cell+=ch}
  if(cell!==''||row.length){row.push(cell);rows.push(row)}
  return rows.filter(r=>r.some(c=>c.trim()!==''));
}
function tableFromObjects(objs,cols,parser){
  const MAX=20000;if(objs.length>MAX)throw{msg:tr('Too many rows ({n}). The limit is {max}.',{n:objs.length,max:MAX})};
  const src=cols?cols.map(c=>({key:String(c.key),label:String(c.label??c.key)})):[...new Set(objs.flatMap(o=>Object.keys(o)))].map(k=>({key:k,label:k}));
  const used=new Set(['id']);
  const keyOf=s=>{let k=String(s).trim().toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'')||'col';if(/^\d/.test(k))k='c'+k;let x=k,i=2;while(used.has(x))x=k+'_'+i++;used.add(x);return x};
  const val=v=>{if(v==null)return null;if(typeof v==='number')return isFinite(v)?v:null;if(typeof v==='boolean')return v;
    const s=String(v).trim();if(s==='')return null;return/^[-+]?(\d+\.?\d*|\.\d+)([eE][-+]?\d+)?$/.test(s)?+s:s};
  const idCol=src.find(c=>c.key.trim().toLowerCase()==='id');const ids=idCol?objs.map(o=>val(o[idCol.key])):null;
  const useIds=!!ids&&ids.every(Number.isInteger)&&new Set(ids).size===ids.length;
  const columns=[{key:'id',label:useIds?idCol.label:tr('Row')}],map=[];
  src.forEach(c=>{if(useIds&&c===idCol)return;const k=keyOf(c.key);columns.push({key:k,label:c.label});map.push([c.key,k])});
  const rows=objs.map((o,i)=>{const r={id:useIds?ids[i]:i+1};map.forEach(([from,to])=>{r[to]=val(o[from])});return r});
  return{columns,rows,parser};

function parseDataFile(name,text){

    if(Array.isArray(j)&&j.length&&j.every(r=>r&&typeof r==='object'&&!Array.isArray(r)))return tableFromObjects(j,null,'json');
    throw{msg:tr('{file}: the JSON must be a list of objects, or an object with "columns" and "rows".',{file:name})}}
  const grid=parseDelimited(text);if(grid.length<2)throw{msg:tr('{file} needs a header row and at least one data row.',{file:name})};
  const head=grid[0].map((k,i)=>k.trim()||'col'+(i+1));

/* habits/: learn the user's figure style from their own files, then let them confirm */
function parseMplstyle(txt){
  const kv={};txt.split(/\r?\n/).forEach(l=>{const m=/^\s*([\w.-]+)\s*:\s*(.*?)\s*(#.*)?$/.exec(l);if(m)kv[m[1]]=m[2].replace(/^['"]|['"]$/g,'')});
  const out={},num=k=>{const v=parseFloat(kv[k]);return isFinite(v)?v:null},yes=v=>/^true$/i.test(String(v||'').trim());
  let fam=(kv['font.family']||'').split(',')[0].trim();if(/^(sans-serif|serif|monospace)$/.test(fam))fam=(kv['font.'+fam]||'').split(',')[0].trim();if(fam)out['font.family']=fam;
  const tick=num('xtick.labelsize')??num('font.size');if(tick)out['font.size']=tick;
  if(num('axes.labelsize'))out['font.label']=num('axes.labelsize');
  if(num('lines.linewidth'))out.line=num('lines.linewidth');
  if(num('lines.markersize'))out.marker=num('lines.markersize');
  if(/^(in|out)$/.test(kv['xtick.direction']||''))out.ticks=kv['xtick.direction'];
  if(kv['axes.grid']!=null)out.grid=yes(kv['axes.grid']);
  if(kv['axes.spines.top']!=null||kv['axes.spines.right']!=null)out.frame=yes(kv['axes.spines.top']??kv['axes.spines.right']);
  const cyc=/color'?\s*,\s*\[([^\]]*)\]/.exec(kv['axes.prop_cycle']||'');
  if(cyc){const pal=cyc[1].split(',').map(s=>s.trim().replace(/['"]/g,'')).map(s=>parseColor(/^[0-9a-f]{6}$/i.test(s)?'#'+s:s)).filter(Boolean).slice(0,6);if(pal.length)out.palette=pal}
  const w=parseFloat((kv['figure.figsize']||'').split(',')[0]);if(w>0){const pt=w*72;out['figure.preset']=Math.abs(pt-234)<25?'acs1':Math.abs(pt-504)<40?'acs2':'free'}
  return out;
}
function validStyleValue(f,v){
  if(['font.size','font.label','marker','line'].includes(f))return typeof v==='number'&&v>0&&v<100;
  if(f==='font.family')return typeof v==='string'&&v.length<80;
  if(f==='ticks')return v==='in'||v==='out';
  if(f==='frame'||f==='grid')return typeof v==='boolean';
  if(f==='palette')return Array.isArray(v)&&v.length<=6&&v.every(c=>/^#[0-9a-f]{6}$/i.test(c));
  if(f==='figure.preset')return typeof v==='string'&&v in PRESET_PT;
  if(f==='chartDefaults.kind')return v===null||v==='scatter'||v==='line';
  if(f==='chartDefaults.logY')return v===null||typeof v==='boolean';
  return false;
}
const effective=(st,f)=>f==='palette'?[...Array(6)].map((_,i)=>st.palette[i]||DEFAULT_PALETTE[i]):getPath(st,f);
async function learnHabits(){
  if(!S.folder||S.learning)return;S.learning=true;renderPanel();
  try{const hd=await subdir(S.folder.dir,'habits'),files=[...await listFiles(hd,HABIT_EXT),...await listFiles(await subdir(hd,'figures'),HABIT_EXT)];
    const votes=new Map();let n=0,profile=null;
    const vote=(field,value,file,source)=>{if(value==null||value===''||!validStyleValue(field,value))return;
      const m=votes.get(field)||votes.set(field,new Map()).get(field),k=JSON.stringify(value);const e=m.get(k)||m.set(k,{value,source,files:[]}).get(k);e.files.push(file);if(e.source!==source)e.source='files'};
    for(const fh of files){const name=fh.name,text=async()=>(await fh.getFile()).text();
      if(/\.svg$/i.test(name)){n++;const a=analyzeSVG(await text());vote('font.family',a.family,name,'svg');vote('font.size',a.size,name,'svg');vote('line',a.line,name,'svg');
        if(a.palette.length)vote('palette',a.palette,name,'svg');
        if(a.widthPt){const p=Math.abs(a.widthPt-234)<25?'acs1':Math.abs(a.widthPt-504)<40?'acs2':null;if(p)vote('figure.preset',p,name,'svg')}}
      else if(/\.mplstyle$/i.test(name)){n++;Object.entries(parseMplstyle(await text())).forEach(([f,v])=>vote(f,v,name,'mplstyle'))}
      else if(name==='profile.json'){try{profile=JSON.parse(await text())}catch(e){}}}
    const st=styleNow(),rows=profileRows(profile);
    votes.forEach((m,field)=>{if(rows.some(r=>r.field===field))return;const best=[...m.values()].sort((a,b)=>b.files.length-a.files.length)[0];
      if(same(best.value,effective(st,field)))return;
      rows.push({field,value:best.value,source:best.source,on:best.files.length*2>=n,
        from:tr('{k} of {n} files: {files}',{k:best.files.length,n,files:best.files.slice(0,3).join(', ')+(best.files.length>3?', …':'')})})});
    S.proposal=rows;S.tab='style';
    if(!rows.length)toast(n||profile?tr('Your habits already match the current style. Nothing to change.'):tr('No SVG, .mplstyle or profile.json files in habits/.'))}
  catch(e){fail(tr('Analysis failed. Please try again.'),e)}
  finally{S.learning=false;renderPanel()}
}
function profileRows(profile){ // style suggestions from saved habits (habits/profile.json or the personal copy)

/* ---------- Data chain ----------
   steps/{id} records one computation: a script turned input files into output files. A file is known by its path
   (relative to the folder of report.json) and its SHA-256; a file that no step produced is raw data. Following the
   source file of a dataset back through the steps that made it gives the whole chain, down to the raw files.
   A step needs recomputing when its script or an input changed, or an input comes from a step that needs recomputing.
   The page checks the files itself: through the launcher, which keeps a fingerprint cache on disk, or directly in a
   folder opened in the page. Size and modification time are compared first, so large raw files are only read when
   they differ. In a Claude Artifact or a read-only copy nothing can be checked, and the chain is shown in grey. */

const isAbsPath=p=>/^([A-Za-z]:|[\\/])/.test(String(p||''));
const baseName=p=>normPath(p).split('/').pop();
const refKey=r=>normPath(r.path)+'|'+(r.sha256||'')+'|'+(r.size??'')+'|'+(r.modified||'');

  (s.inputs||[]).forEach(r=>{if(r&&r.path)out.push(['input',r])});(s.outputs||[]).forEach(r=>{if(r&&r.path)out.push(['output',r])});return out}

const fileState=r=>{const f=r&&S.fstate&&S.fstate.get(refKey(r));return f?f.state:null}; // same, changed, missing, outside, unknown
const stateOf=st=>st==='same'?'ok':st==='changed'||st==='missing'||st==='outside'?'stale':'unchecked';
const rootName=()=>(S.folder&&S.folder.name)||'';
function fileWhy(r,role){const st=fileState(r),f={file:r.path};
  return st==='missing'?tr('{file} is missing',f):st==='outside'?tr('{file} is outside "{folder}"',{...f,folder:rootName()})
    :st==='changed'?(role==='output'?tr('{file} changed after the step was recorded',f):role==='source'?tr('{file} changed since import',f):tr('{file} changed',f)):null}

  const add=(m,k,v)=>{const l=m.get(k)||m.set(k,[]).get(k);if(!l.includes(v))l.push(v)};

  orderedBlocks().forEach(b=>{const id=(b.type==='chart'||b.type==='table')&&(b.chart||b.table||{}).dataset;if(id)add(blocksOf,id,b)});
  const memo=new Map();
  function stepStatus(s,trail){

    const t=new Set(trail||[]).add(s.id),why=[],states=[],nw=newIn.get(s.id)||[];
    if(nw.length)why.push(tr('{n} new files match its input patterns: {files}',{n:nw.length,files:nw.slice(0,3).map(baseName).join(', ')+(nw.length>3?' …':'')}));
    stepFiles(s).forEach(([role,r])=>{const w=fileWhy(r,role);if(w)why.push(w);else states.push(stateOf(fileState(r)))});

    derived:[...madeBy.keys()],raw:[...inputs].filter(p=>!madeBy.has(p)).sort(),scripts:[...scripts].sort()};
}
function blockDataset(b){const id=(b.type==='chart'||b.type==='table')&&(b.chart||b.table||{}).dataset,d=id&&S.datasets.get(id);return d&&d.source&&d.source.path?d:null}
function blockChainState(b){const d=blockDataset(b);return d?chain().datasetStatus(d).state:null}
const STATE_TEXT={ok:'Up to date',stale:'Needs recomputing',unchecked:'Not checked'};
const dot=st=>h('span',{class:'dot '+(st||''),title:tr(STATE_TEXT[st]||'Not checked')});
const scriptName=s=>s.script&&s.script.path?baseName(s.script.path):s.id;
function inputCount(C,s){const ins=(s.inputs||[]).filter(r=>r&&r.path),d=ins.filter(r=>C.madeBy.has(normPath(r.path))).length;return{d,r:ins.length-d}}

  if(s){parts.push(scriptName(s));const n=inputCount(C,s),ins=[];
    if(n.d)ins.push(n.d===1?tr('1 derived file'):tr('{n} derived files',{n:n.d}));

    onclick:e=>{e.stopPropagation();openChain(d,b)}},[dot(st.state),h('span',{class:'t',text:parts.join(' ← ')})]);

const fileDot=r=>chain().isNew(r.path)?'stale':stateOf(fileState(r));
function fileRow(r){ // one file: state, path, fingerprint, size, date

  if(chain().isNew(r.path))return h('div',{class:'fr'},[dot('stale'),h('span',{class:'mono',text:r.path}),h('span',{class:'bad',text:tr('new, not used yet')}),rv]);

function groupByFolder(refs){const m=new Map();

const hashMemo=new Map(); // path|size|time -> sha256, for this page session
async function localFingerprint(r){
  const F=S.folder,out={path:r.path,state:'missing'};
  if(isAbsPath(r.path))return{...out,state:'outside'};
  const segs=normPath((F.dir!==F.root?F.dir.name+'/':'')+normPath(r.path)).split('/');
  if(segs[0]==='..')return{...out,state:'outside'};
  try{let d=F.root;for(const s of segs.slice(0,-1))d=await d.getDirectoryHandle(s);
    const f=await(await d.getFileHandle(segs[segs.length-1])).getFile(),rec=r.modified?Date.parse(r.modified):NaN;
    Object.assign(out,{size:f.size,modified:new Date(f.lastModified).toISOString()});
    if(r.sha256&&r.size===f.size&&Math.abs(rec-f.lastModified)<=SLACK_MS)return{...out,state:'same',sha256:r.sha256};
    const k=normPath(r.path)+'|'+f.size+'|'+f.lastModified;let sha=hashMemo.get(k);
    if(!sha){sha=await sha256(await f.arrayBuffer());hashMemo.set(k,sha)}
    return{...out,sha256:sha,state:!r.sha256?'unknown':sha===r.sha256?'same':'changed'}}
  catch(e){return out}
}
// A step's inputPatterns (for example ../Data/<any folder>/run*.csv) find files added since it ran:
// * ? and [abc] match within a name, ** matches any number of folders (as in Python's glob with recursive=True)
function globRegex(seg){let r='';
  for(let i=0;i<seg.length;i++){const c=seg[i];
    if(c==='*')r+='[^/]*';else if(c==='?')r+='[^/]';
    else if(c==='['&&seg.indexOf(']',i+2)>i){const j=seg.indexOf(']',i+2);let cls=seg.slice(i+1,j);if(cls[0]==='!')cls='^'+cls.slice(1);r+='['+cls.replace(/\\/g,'\\\\')+']';i=j}
    else r+=c.replace(/[.+^${}()|[\]\\]/g,'\\$&')}
  return new RegExp('^'+r+'$')}
async function globFiles(pattern){ // paths relative to the folder of report.json, like Python's glob(recursive=True)
  const F=S.folder;if(!F||isAbsPath(pattern))return[];
  const base=F.dir!==F.root?F.dir.name+'/':'',segs=normPath(base+String(pattern).replace(/\\/g,'/')).split('/');
  if(!segs[0]||segs[0]==='..')return[];
  const out=[],magic=s=>/[*?[]/.test(s);
  async function walk(d,i,prefix,depth){
    if(out.length>=5000||depth>12)return;const s=segs[i],last=i===segs.length-1;
    if(s==='**'){if(!last)await walk(d,i+1,prefix,depth);
      for await(const[name,hd]of d.entries())if(hd.kind==='directory'&&!name.startsWith('.'))await walk(hd,i,prefix+name+'/',depth+1);return}
    if(!magic(s)){try{if(last){await d.getFileHandle(s);out.push(prefix+s)}else await walk(await d.getDirectoryHandle(s),i+1,prefix+s+'/',depth+1)}catch(e){}return}
    const re=globRegex(s);
    for await(const[name,hd]of d.entries()){if(!re.test(name)||(name.startsWith('.')&&!s.startsWith('.')))continue;
      if(last){if(hd.kind==='file')out.push(prefix+name)}else if(hd.kind==='directory')await walk(hd,i+1,prefix+name+'/',depth+1)}}
  try{await walk(F.root,0,'',0)}catch(e){}
  return out.map(p=>!base?p:p.startsWith(base)?p.slice(base.length):'../'+p);
}
async function newInputsNow(){ // step id -> files matching its patterns that it did not use
  const found=new Map(),byPattern=new Map();
  for(const s of S.steps.values()){if(!s||!Array.isArray(s.inputPatterns)||!Array.isArray(s.inputs))continue;
    const now=new Set();
    for(const p of s.inputPatterns){if(typeof p!=='string')continue;if(!byPattern.has(p))byPattern.set(p,await globFiles(p));byPattern.get(p).forEach(x=>now.add(normPath(x)))}

}

async function verifyChain(){
  const seq=S.verifySeq=(S.verifySeq||0)+1;
  if(!S.folder){if(S.fstate){S.fstate=null;S.newInputs=null;S.stale=new Set();render()}return}
  const refs=new Map();
  S.steps.forEach(s=>{if(s&&typeof s==='object')stepFiles(s).forEach(([,r])=>refs.set(refKey(r),r))});
  S.datasets.forEach(d=>{if(d.source&&d.source.path)refs.set(refKey(d.source),d.source)});
  const list=[...refs.values()];let res=null;
  S.checking=true;if(S.tab==='folder')renderPanel();
  try{if(S.server)res=await serverFingerprints(list);else{res=[];for(const r of list)res.push(await localFingerprint(r))}} // one at a time: raw files can be large
  catch(e){logIssue('warning',tr('Could not check the files of the data chain.'),errText(e))}
  let fresh=new Map();try{fresh=await newInputsNow()}catch(e){}
  if(seq!==S.verifySeq)return;
  S.checking=false;
  const m=new Map();if(res)list.forEach((r,i)=>m.set(refKey(r),res[i]||{}));
  const sig=x=>x?[...x].map(([k,v])=>k+'='+(v.state||v)).sort().join('\n'):'';
  const changed=sig(m)!==sig(S.fstate)||sig(fresh)!==sig(S.newInputs);
  S.fstate=m;S.newInputs=fresh;S.stale=new Set([...S.datasets.values()].filter(d=>d.source&&d.source.path&&fileState(d.source)==='changed').map(d=>d.id));
  if(changed)render();else renderPanel();
}
