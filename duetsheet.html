      h('div',{class:'crow'},[B(tr('Apply selected'),applyWriting,'primary'),B(tr('Dismiss'),dismissWriting)]))}
  const R=writingRules(),ul=h('ul',{class:'flist wrules'});
  R.forEach(r=>ul.append(h('li',{},[h('span',{text:r.text}),r.from?h('span',{class:'fstat',text:r.from}):null,
    h('button',{type:'button',class:'linkbtn',text:tr('Remove'),onclick:()=>setWriting(R.filter(x=>x!==r))})])));
  const add=h('input',{type:'text',placeholder:tr('Add a rule of your own, for example: Give the conclusion first, then the numbers.')});
  const addRule=()=>{const t=add.value.trim();if(t)setWriting([...R,{text:t,from:tr('added by you')}])};
  add.addEventListener('keydown',e=>{if(e.key==='Enter')addRule()});
  sec.append(h('h5',{text:tr('Your writing habits ({n})',{n:R.length})}),R.length?ul:h('p',{class:'cap',text:tr('None yet. Agents follow these rules whenever they write or revise text in this report.')}),
    h('div',{class:'crow wadd'},[add,B(tr('Add'),addRule)]),h('div',{class:'crow'},[B(tr('Save as my writing habits'),saveWritingFile,'',!R.length)]),
    h('p',{class:'cap',text:tr('Saved habits go to habits/writing.json. Copy that file into the habits/ folder of your next project to start from the same habits.')}));
  return sec;
}

/* Personal habits: one copy in ~/.duetsheet/habits/ shared by all projects (through the launcher) */
async function personalCall(method,body){
  const r=await fetch('/api/personal',{method,headers:{'X-Duetsheet-Token':S.server.token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
  if(!r.ok)throw new Error(r.status+' '+await r.text());return method==='GET'?r.json():null;
}
async function savePersonal(){
  try{await personalCall('PUT',{profile:styleExport(styleNow()),writing:{rules:writingRules()}});S.personal=null;toast(tr('Saved as your personal habits. New projects can load them.'));loadPersonalInfo()}
  catch(e){fail(tr('Save failed. Please try again.'),e)}
}
async function loadPersonal(){
  try{const p=await personalCall('GET');const rows=profileRows(p.profile);
    if(rows.length){S.proposal=rows}
    if(p.writing&&Array.isArray(p.writing.rules)&&p.writing.rules.length)proposeWriting(p.writing.rules,'personal');
    else if(!rows.length)toast(tr('Nothing new: these habits are already applied.'));
    if(rows.length)toast(tr('Figure suggestions are in the Style tab.'))}
  catch(e){fail(tr('Could not load your personal habits.'),e)}
}
async function loadPersonalInfo(){if(!S.server||S.personal)return;S.personal={};try{S.personal=await personalCall('GET');renderPanel()}catch(e){}}
function personalSection(B){
  if(!S.server)return h('div',{class:'stsec'},[h('h4',{text:tr('Personal habits (all projects)')}),h('p',{class:'cap',text:tr('Available when the report is opened with the launcher (duetsheet.py). Meanwhile, copy habits/profile.json and habits/writing.json between projects.')})]);
  loadPersonalInfo();const p=S.personal,nw=p&&p.writing&&Array.isArray(p.writing.rules)?p.writing.rules.length:0,has=!!(p&&(p.profile||nw));
  return h('div',{class:'stsec'},[h('h4',{text:tr('Personal habits (all projects)')}),
    h('p',{class:'cap',text:has?tr('You have personal habits: a figure style and {n} writing rules. Load them to use them in this report.',{n:nw}):tr('Save this report\'s figure style and writing habits once, and load them in every new project.')}),
    h('div',{class:'crow'},[B(tr('Load my personal habits'),loadPersonal,has&&!writingRules().length?'primary':'',!has),B(tr('Save as my personal habits'),savePersonal)])]);
}

/* ---------- Ask the agent to revise ----------
   The page never calls an AI model. With the launcher, a request is a notice stored by duetsheet.py; an agent waiting
   with "duetsheet.py wait" picks it up, reads the annotations from report.json, and reports progress with
   "duetsheet.py agent-status", which the page shows here. Without a listening agent, the page offers a prompt to paste. */
const openCount=()=>S.annos.filter(a=>a.status!=='done').length;
const ageS=iso=>iso?(Date.now()-Date.parse(iso))/1000:Infinity;
function agentView(){ // what the bar shows: {state, text, cls}
  const A=S.agent,req=A&&A.request,st=A&&A.status;
  if(!req)return{state:'idle'};
  if(!st){const waiting=ageS(req.at)<(A.listening?60:10);
    return waiting?{state:'sent',text:tr('Request sent. Waiting for the agent…')}:{state:'unanswered',text:tr('No agent has answered yet.'),cls:'bad'}}
  const note=st.note?' '+st.note:'';
  if(st.state==='working')return{state:'working',text:tr('The agent is revising the report…')+note};
  if(st.state==='failed')return{state:'failed',text:tr('The agent could not finish.')+note,cls:'bad'};
  const n=S.annos.filter(a=>a.status==='done'&&a.resolvedAt&&a.resolvedAt>=req.at).length;
  return ageS(st.at)<1800?{state:'done',text:tr('The agent handled {n} comments.',{n})+note,cls:'ok'}:{state:'idle'};
}
function renderAgentBar(){ // the agent strip above the report: connection, progress, and the two round buttons
  const box=$('#agentbar');if(!box)return;
  const open=openCount(),cur=currentChanges().length,v=agentView(),busy=v.state==='sent'||v.state==='working',listening=!!(S.agent&&S.agent.listening);
  const show=!S.readonly&&!!S.meta&&!!(S.server||open||cur);
  const key=show?[open,cur,v.state,v.text,listening,!!S.server].join('|'):'';
  if(key===box.dataset.key)return;box.dataset.key=key;box.replaceChildren();box.hidden=!show;if(!show)return; // rebuilt only when it changes, so a click is never lost
  const B=(t,fn,cls,title)=>h('button',{type:'button',class:'btn small'+(cls?' '+cls:''),text:t,title,onclick:fn});
  box.append(h('span',{class:'conn'},[h('span',{class:'dot'+(listening?' ok':'')}),h('span',{text:listening?tr('Agent listening'):tr('No agent connected')})]));
  if(!listening||v.state==='unanswered')box.append(h('button',{type:'button',class:'linkbtn',text:tr('Get a prompt to paste'),onclick:openAgentPrompt}));
  if(v.text)box.append(h('span',{class:'ast'+(v.cls?' '+v.cls:''),text:v.text}));
  box.append(h('span',{class:'sp'}));
  if(cur)box.append(B(tr('Finish this round ({n})',{n:cur}),finishRound,'',tr('Move the current changes into the history as one round.')));
  if(open&&!busy)box.append(B(tr('Ask the agent to revise ({n})',{n:open}),askAgent,'primary',
    listening?tr('An agent is listening and will revise the report now.'):tr('No agent is listening. You will get a prompt to paste into your agent.')));
}
async function askAgent(){
  const open=openCount();
  if(currentChanges().some(c=>c.by==='user'))await finishRound();
  if(!S.server){openAgentPrompt();return}
  try{const r=await fetch('/api/revise',{method:'POST',headers:{'X-Duetsheet-Token':S.server.token,'Content-Type':'application/json'},body:JSON.stringify({kind:'revise',open})});
    if(!r.ok)throw new Error(r.status+' '+await r.text());S.agent=await r.json()}
  catch(e){fail(tr('Could not send the request to the agent.'),e);return}
  renderAgentBar();
  if(S.agent.listening)toast(tr('Sent. The agent will revise the report; this page updates by itself.'));else openAgentPrompt();
}
async function pollAgent(){
  if(!S.server)return;
  try{const r=await fetch('/api/agent',{headers:{'X-Duetsheet-Token':S.server.token}});if(r.ok)S.agent=await r.json()}catch(e){}
  renderAgentBar();
}
function agentPrompt(){
  const i=S.server&&S.server.info,sep=i&&i.app&&i.app.includes('\\')?'\\':'/';
  if(i&&i.root&&i.app)return tr('Handle the open comments of the Duetsheet report in "{folder}". First read {agents} and follow "Revise the report from the user\'s annotations"; list the comments with: python "{py}" annotations "{folder}". When you are done, keep listening: run python "{py}" wait "{folder}" in the background and handle each new request the same way.',
    {folder:i.root,agents:i.app+sep+'AGENTS.md',py:i.app+sep+'duetsheet.py'});
  if(S.cloud)return tr('Read the Duetsheet annotations in this Artifact and revise the report:')+' ';
  if(S.folder)return tr('Handle the open comments of the Duetsheet report in the folder "{name}" ({file}): read AGENTS.md of Duetsheet and follow "Revise the report from the user\'s annotations".',{name:S.folder.name,file:S.folder.file});
  return tr('Save the report file, give it to your agent, and ask it to handle the open comments following AGENTS.md of Duetsheet.');
}
function openAgentPrompt(){
  const ta=h('textarea',{readonly:'',rows:'7',style:'width:100%;box-sizing:border-box;font:inherit;font-size:13px'});ta.value=agentPrompt();
  const intro=S.server?tr('No agent is listening for this report right now. Your request is saved: paste this into your agent (Claude Code, Codex, Gemini CLI, ...). It picks up the request and then keeps listening for the next one.')
    :S.cloud?tr('Go back to Claude, paste this, and add the link of this Artifact.'):tr('This page cannot reach an agent by itself. Paste this into your agent:');
  openModal(tr('Ask the agent to revise'),[h('div',{class:'langbox'},[h('p',{text:intro}),ta,
    h('div',{class:'crow'},[h('span',{class:'sp'}),
      h('button',{type:'button',class:'btn small',text:tr('Copy'),onclick:async()=>{try{await navigator.clipboard.writeText(ta.value);toast(tr('Copied'))}catch(e){ta.focus();ta.select()}}}),
      h('button',{type:'button',class:'btn small primary',text:tr('Close'),onclick:closeModal})])])]);
}

/* ---------- Welcome and help ---------- */
const REPO_URL='https://github.com/Ashur5457/duetsheet';
function openHelp(){
  const step=(t,d)=>h('li',{},[h('strong',{text:t}),' '+d]);
  const link=(path,t)=>h('a',{href:REPO_URL+path,target:'_blank',rel:'noopener',text:t});
  openModal(tr('Welcome to Duetsheet'),[h('div',{class:'langbox'},[
    h('p',{text:tr('Duetsheet is a report that you and an AI agent revise together. Every change is recorded with who made it.')}),
    h('ol',{},[
      step(tr('Read.'),tr('View shows the report as pages. Turn pages with the arrow keys.')),
      step(tr('Review.'),tr('In Edit, change text and charts directly. Under each block, write a comment or pick a tag. On a chart, click a point or draw a box or a lasso.')),
      step(tr('Keep track.'),tr('The Changes tab lists every change, by you or by the agent. Click "Finish this round" when you are done.')),
      step(tr('Hand it to your agent.'),S.cloud?tr('Go back to Claude and ask it to read the annotations and revise the report.')
        :tr('Open a project folder. Your agent (Claude Code, Codex, Gemini CLI, ...) edits report.json in the same folder, following AGENTS.md.'))]),
    h('p',{},[link('/blob/main/docs/tutorial.md',tr('Tutorial with screenshots')),' · ',link('/blob/main/AGENTS.md',tr('AGENTS.md (for agents)'))]),
    h('div',{class:'crow'},[h('span',{class:'sp'}),h('button',{type:'button',class:'btn small primary',text:tr('Got it'),onclick:closeModal})])])]);
}
function welcomeOnce(){try{if(localStorage.getItem('duetsheet-welcomed'))return;localStorage.setItem('duetsheet-welcomed','1')}catch(e){return}openHelp()}
$('#helpBtn').addEventListener('click',openHelp);

/* ---------- Startup and sync ---------- */
async function seedIfEmpty(){
  const m=await db.doc('report/meta').get();if(m.exists)return;
  const ds=seedData(),blocks=seedBlocks(),t=now();
  await db.doc('datasets/'+ds.id).set(ds);
  for(const b of blocks)await db.doc('blocks/'+b.id).set({...b,createdAt:t});
  await db.doc('report/meta').set({title:tr('NIMO demo report'),order:blocks.map(b=>b.id),schema:SCHEMA,createdAt:t});
}
function subscribe(){
  const fail=e=>{const m=tr('Failed to read cloud data (')+((e&&e.code)||tr('unknown'))+tr('). Please reload.');showNote(m);logIssue('error',m,errText(e))};
  const quiet=fn=>{if(editingNow()){renderPanel()}else fn()};
  db.doc('report/meta').onSnapshot(s=>{if(s.exists){S.meta=s.data();render()}},fail);
  db.collection('blocks').limit(500).onSnapshot(s=>{S.blocks=new Map(s.docs.map(d=>[d.id,d.data()]).filter(x=>x[1]));render()},fail);
  db.collection('datasets').limit(500).onSnapshot(s=>{S.datasets=new Map(s.docs.map(d=>[d.id,d.data()]).filter(x=>x[1]));scheduleVerify();render()},fail);
  db.collection('annotations').limit(1000).onSnapshot(s=>{S.annos=s.docs.map(d=>d.data()).filter(a=>a&&a.id);quiet(()=>{renderPanel();paintAllOverlays()})},fail);
  db.collection('changes').limit(1000).onSnapshot(s=>{S.changes=s.docs.map(d=>d.data()).filter(c=>c&&c.id);renderPanel()},fail);
  db.collection('rounds').limit(500).onSnapshot(s=>{S.rounds=s.docs.map(d=>d.data()).filter(r=>r&&r.id);renderPanel()},fail);
  db.collection('steps').limit(1000).onSnapshot(s=>{S.steps=new Map(s.docs.map(d=>[d.id,d.data()]).filter(x=>x[1]&&typeof x[1]==='object'));scheduleVerify();render()},fail);
  db.doc('style/profile').onSnapshot(s=>{S.style=s.exists?s.data():null;render()},fail);
  db.collection('examples').limit(200).onSnapshot(s=>{S.examples=s.docs.map(d=>d.data()).filter(x=>x&&x.id);renderPanel()},fail);
  db.doc('style/writing').onSnapshot(s=>{S.writing=s.exists?s.data():null;renderPanel()},fail); // the writing habits the user confirmed
  db.doc('style/writingProposal').onSnapshot(s=>{const d=s.exists?s.data():null; // written by an agent, confirmed by the user in Folder > Habits
    const rules=d&&Array.isArray(d.rules)?d.rules.filter(r=>r&&typeof r.text==='string'&&r.text.trim()&&r.text.length<600)
      .map(r=>({text:r.text.trim(),from:r.from?String(r.from):'',conf:typeof r.conf==='number'?r.conf:null,on:(r.conf??1)>=0.6})):[];
    S.writingProposal=rules.length?{rules,note:d.note?String(d.note):'',source:'agent'}:(S.writingProposal&&S.writingProposal.source!=='agent'?S.writingProposal:null);renderPanel()},fail);
  db.doc('style/proposal').onSnapshot(s=>{const d=s.exists?s.data():null; // written by an agent, confirmed by the user in the Style tab
    const rows=d&&Array.isArray(d.rows)?d.rows.filter(r=>r&&STYLE_FIELDS.includes(r.field)&&validStyleValue(r.field,r.value)).map(r=>({field:r.field,value:r.value,conf:r.conf,from:r.from?String(r.from):'',source:'agent',on:(r.conf??1)>=0.6})):[];
    S.agentProposal=rows.length?{rows,note:d.note?String(d.note):''}:null;renderPanel()},fail);
}
function showNote(t,acts,ok){const n=$('#note-db');$('#note-text').textContent=t||'';$('#note-acts').replaceChildren(...(acts||[]));n.hidden=!t;n.classList.toggle('saved',!!ok)}
async function start(){
  const emb=document.getElementById('duetsheet-embedded');
  if(emb){S.readonly=true;document.body.classList.add('readonly');setMode('view'); // a read-only copy: the report is inside this file
    try{db=memDB(readReport(emb.textContent,tr('This file')))}catch(e){fail(e&&e.msg||tr('This is not a Duetsheet report file.'),e&&e.detail);return}
    subscribe();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(render);return}
  setMode('view');
  let cloud=null;try{cloud=(window.claude&&window.claude.use)?await window.claude.use('db'):null}catch(e){cloud=null}
  if(cloud){db=cloud;S.cloud=true}else db=memDB();
  try{await seedIfEmpty()}catch(e){if(S.cloud){S.initError=tr('Failed to initialise cloud data (')+((e&&e.code)||tr('unknown'))+tr('). Showing local mode.');logIssue('error',S.initError,errText(e));db=memDB();S.cloud=false;await seedIfEmpty()}}
  subscribe();
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(render);
  if(S.cloud){const tryUse=async n=>{try{return await window.claude.use(n)}catch(e){return null}};
    const[a,sm,dl]=await Promise.all(['assets','sample','downloads'].map(tryUse));S.caps={assets:a,sample:sm,downloads:dl};render()}
  else if(!await connectServer()){renderLocalBar();restoreFolder()}
  welcomeOnce();
}
$('#lang').addEventListener('change',e=>{const v=e.target.value;if(v==='__add'){e.target.value=LANG;openLangDialog();return}if(v!==LANG)switchLang(v)});
$('#langfile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;
  try{if(f.size>1e6)throw{};const text=await f.text(),r=importLang(JSON.parse(text));closeModal();switchLang(r.code);
    if(S.folder)subdir(S.folder.dir,'lang',true).then(d=>d&&writeFile(d,r.code+'.json',text)).catch(()=>{});
    toast(tr('Loaded {name}: {n} sentences',{name:r.name,n:r.n})+(r.bad?tr(' ({b} skipped: placeholders do not match)',{b:r.bad}):''))}
  catch(err){fail(err&&err.msg?err.msg:tr('This is not a valid Duetsheet translation file.'),err)}});
collectStatic();applyStatic();
start();
})();
</script>
